<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101513">
  <title>Staniek Maps</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    *{box-sizing:border-box}html,body,#map{height:100%;margin:0}body{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#111;color:#fff;overflow:hidden}.leaflet-control-attribution{font-size:9px}.leaflet-control-zoom{display:none}
    .top{position:fixed;z-index:1000;left:14px;right:14px;top:max(14px,env(safe-area-inset-top));display:flex;gap:10px}.brand{height:54px;min-width:54px;border-radius:18px;background:#151a18;box-shadow:0 5px 24px #0005;display:grid;place-items:center;font-weight:900;font-size:23px;color:#39e675;border:1px solid #ffffff14}.search{height:54px;flex:1;border:0;border-radius:18px;background:#fff;color:#161616;box-shadow:0 5px 24px #0004;padding:0 18px;font-size:16px;font-weight:650;outline:none}.results{position:fixed;z-index:1100;left:78px;right:14px;top:78px;background:#fff;color:#111;border-radius:16px;overflow:hidden;box-shadow:0 8px 30px #0005;display:none}.result{padding:13px 15px;border-bottom:1px solid #eee;cursor:pointer;font-size:14px}.result:last-child{border:0}
    .right{position:fixed;z-index:1000;right:14px;bottom:112px;display:flex;flex-direction:column;gap:10px}.round{width:52px;height:52px;border:0;border-radius:18px;background:#fff;color:#171717;box-shadow:0 5px 20px #0004;font-size:22px;cursor:pointer}.report{background:#ff3d3d;color:#fff;font-size:20px;font-weight:900}
    .speed{position:fixed;z-index:1000;left:14px;bottom:24px;width:78px;height:78px;border-radius:24px;background:#151a18eF;border:1px solid #ffffff18;box-shadow:0 5px 25px #0006;display:flex;flex-direction:column;align-items:center;justify-content:center}.speed strong{font-size:30px;line-height:28px}.speed small{font-size:10px;color:#aaa;margin-top:5px}.name{position:fixed;z-index:1000;left:104px;bottom:35px;background:#151a18eF;border:1px solid #ffffff18;border-radius:18px;padding:13px 16px;box-shadow:0 5px 25px #0005;font-weight:800}.name b{color:#39e675}
    .sheet{position:fixed;z-index:1200;left:10px;right:10px;bottom:10px;background:#151a18;border-radius:26px;padding:18px;box-shadow:0 -10px 40px #0007;transform:translateY(130%);transition:.25s}.sheet.open{transform:translateY(0)}.sheet h3{margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.item{border:0;border-radius:18px;background:#242a27;color:#fff;padding:15px 6px;font-weight:700}.item span{display:block;font-size:25px;margin-bottom:5px}.close{width:100%;margin-top:12px;border:0;border-radius:16px;padding:13px;background:#333;color:#fff;font-weight:700}
    .user-dot{width:20px;height:20px;background:#39e675;border:4px solid white;border-radius:50%;box-shadow:0 0 0 7px #39e67544}
    @media(min-width:800px){.top{left:24px;right:auto;width:430px}.results{left:88px;right:auto;width:366px}.right{right:24px}.sheet{left:auto;right:20px;width:390px}.name{display:block}}
  </style>
</head>
<body>
<div id="map"></div>
<div class="top"><div class="brand">S</div><input id="search" class="search" placeholder="Dokąd jedziemy?" autocomplete="off"></div>
<div id="results" class="results"></div>
<div class="right"><button id="locate" class="round" title="Moja lokalizacja">⌖</button><button id="report" class="round report" title="Zgłoś">!</button></div>
<div class="speed"><strong id="speed">0</strong><small>km/h</small></div>
<div class="name">Staniek <b>Maps</b></div>
<div id="sheet" class="sheet"><h3>Co chcesz zgłosić?</h3><div class="grid"><button class="item"><span>🚓</span>Kontrola</button><button class="item"><span>📷</span>Fotoradar</button><button class="item"><span>⚠️</span>Utrudnienie</button><button class="item"><span>💥</span>Wypadek</button><button class="item"><span>🚧</span>Roboty</button><button class="item"><span>⛔</span>Zamknięcie</button></div><button id="close" class="close">Anuluj</button></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map',{zoomControl:false}).setView([52.05,19.25],6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
let userMarker=null,watchId=null;
const userIcon=L.divIcon({className:'',html:'<div class="user-dot"></div>',iconSize:[20,20],iconAnchor:[10,10]});
function startGPS(center=false){if(!navigator.geolocation){alert('Ta przeglądarka nie obsługuje GPS.');return}if(watchId===null){watchId=navigator.geolocation.watchPosition(p=>{const {latitude,longitude,speed}=p.coords;if(!userMarker)userMarker=L.marker([latitude,longitude],{icon:userIcon}).addTo(map);else userMarker.setLatLng([latitude,longitude]);document.getElementById('speed').textContent=speed==null?'0':Math.max(0,Math.round(speed*3.6));if(center){map.setView([latitude,longitude],16);center=false}},()=>alert('Włącz dostęp do lokalizacji dla Staniek Maps.'),{enableHighAccuracy:true,maximumAge:1500,timeout:10000})}else if(userMarker)map.setView(userMarker.getLatLng(),16)}
document.getElementById('locate').onclick=()=>startGPS(true);startGPS(false);
const sheet=document.getElementById('sheet');document.getElementById('report').onclick=()=>sheet.classList.add('open');document.getElementById('close').onclick=()=>sheet.classList.remove('open');
let timer;const input=document.getElementById('search'),results=document.getElementById('results');input.addEventListener('input',()=>{clearTimeout(timer);const q=input.value.trim();if(q.length<3){results.style.display='none';return}timer=setTimeout(async()=>{try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=5&countrycodes=pl&q='+encodeURIComponent(q),{headers:{'Accept-Language':'pl'}});const data=await r.json();results.innerHTML=data.map((x,i)=>`<div class="result" data-i="${i}">${x.display_name}</div>`).join('');results.style.display=data.length?'block':'none';[...results.children].forEach(el=>el.onclick=()=>{const x=data[+el.dataset.i];map.setView([+x.lat,+x.lon],16);L.marker([+x.lat,+x.lon]).addTo(map).bindPopup(x.display_name).openPopup();input.value=x.display_name.split(',')[0];results.style.display='none'})}catch(e){results.style.display='none'}},450)});
</script>
</body>
</html>

<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#101513"><title>Staniek Maps</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body,#map{height:100%;margin:0}body{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden;color:#172019;background:#e7eee9}button,input{font:inherit}.leaflet-control-zoom{display:none}.leaflet-control-attribution{font-size:8px}.top{position:fixed;z-index:1000;top:max(14px,env(safe-area-inset-top));left:14px;right:14px;display:flex;gap:9px;max-width:540px}.brand,.account{height:52px;width:52px;flex:none;border:0;border-radius:18px;display:grid;place-items:center;box-shadow:0 7px 24px #17322128}.brand{background:#101713;color:#36df75;font-size:23px;font-weight:950}.account{background:#fff;font-size:20px}.searchbox{flex:1}.search{width:100%;height:52px;border:0;border-radius:18px;background:#fff;padding:0 18px;font-size:15px;font-weight:750;outline:0;box-shadow:0 7px 24px #17322124}.results{position:fixed;z-index:1110;top:76px;left:14px;right:14px;max-width:475px;background:#fff;border-radius:22px;padding:8px;display:none;box-shadow:0 14px 40px #12271938;max-height:55vh;overflow:auto}.quick{display:flex;gap:8px}.quick button{flex:1;border:0;border-radius:15px;background:#eef6f1;padding:12px;font-weight:850}.result{padding:12px;border-radius:14px}.result:hover{background:#f1f6f3}.side{position:fixed;z-index:1000;right:14px;bottom:112px;display:grid;gap:9px}.circle{width:50px;height:50px;border:0;border-radius:17px;background:#fff;box-shadow:0 6px 20px #12271930;font-size:20px}.report{background:#ee3e43;color:#fff;font-weight:950}.bottom{position:fixed;z-index:1000;left:14px;bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:9px;align-items:end}.speed{width:70px;height:70px;border-radius:21px;background:#101713;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;box-shadow:0 6px 22px #0003}.speed strong{font-size:27px;line-height:28px}.speed small{font-size:10px;margin-top:4px}.logo{height:58px;background:#fff;padding:0 17px;border-radius:18px;font-weight:850;display:flex;align-items:center;box-shadow:0 6px 22px #1227192b}.logo b{color:#20bf60;margin-left:4px}.panel,.card,.route,.sheet{position:fixed;z-index:1200;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));border-radius:25px;padding:18px;box-shadow:0 14px 45px #0b1d123f;background:#fff;display:none}.panel.open,.card.open,.route.open{display:block}.panel h3,.sheet h3{margin:0 0 14px}.profileSub{font-size:13px;color:#778079;margin:-7px 0 14px}.google{width:100%;border:1px solid #dfe4e1;border-radius:16px;background:#fff;padding:13px;font-weight:800}.places{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.places button{border:0;border-radius:16px;background:#edf6f0;padding:14px 8px;font-weight:850}.close{width:100%;border:0;border-radius:15px;background:#edf0ee;padding:12px;margin-top:10px;font-weight:800}.title{font-size:20px;font-weight:950}.address{font-size:13px;color:#707a73;margin:5px 0 14px}.green,.save{width:100%;border:0;border-radius:16px;background:#20c866;color:#fff;padding:14px;font-weight:950}.modalBack{position:fixed;z-index:1390;inset:0;background:#0a120d70;backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:18px}.modalBack.open{display:flex}.addressModal{width:min(440px,100%);background:#fff;border-radius:27px;padding:22px;box-shadow:0 25px 70px #0006;animation:pop .18s ease-out}@keyframes pop{from{transform:scale(.96);opacity:.5}to{transform:scale(1);opacity:1}}.modalHead{display:flex;gap:12px;align-items:center;margin-bottom:18px}.modalIcon{width:48px;height:48px;border-radius:16px;background:#e9f8ef;display:grid;place-items:center;font-size:24px}.modalHead h2{font-size:20px;margin:0}.modalHead p{font-size:12px;color:#778079;margin:3px 0 0}.field{margin-bottom:11px}.field label{font-size:12px;font-weight:850;color:#657069;display:block;margin:0 0 6px 3px}.field input{width:100%;height:49px;border:1px solid #dce4df;border-radius:15px;padding:0 14px;outline:0;background:#fafcfb}.field input:focus{border-color:#25c967;box-shadow:0 0 0 4px #25c96718;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.modalBtns{display:grid;grid-template-columns:1fr 1.5fr;gap:9px;margin-top:5px}.modalBtns button{border:0;border-radius:15px;padding:13px;font-weight:900}.modalCancel{background:#edf0ee}.modalSave{background:#20c866;color:#fff}.homeMarker,.workMarker{width:42px;height:42px;border-radius:15px;background:#fff;display:grid;place-items:center;font-size:23px;border:3px solid #20c866;box-shadow:0 5px 15px #0004}.workMarker{border-color:#4778e8}.route{background:#101713;color:#fff}.route strong{color:#3ade78}.route button{width:100%;border:0;border-radius:15px;padding:13px;margin-top:9px;font-weight:900}.start{background:#27cb67;color:#fff}.navTop,.navBottom{position:fixed;z-index:1250;left:12px;right:12px;background:#101713;color:#fff;border-radius:22px;padding:14px;display:none}.navTop{top:12px}.navBottom{bottom:12px}.navTop.open,.navBottom.open{display:flex;justify-content:space-between}.sheet{display:block;background:#111714;color:#fff;transform:translateY(130%);transition:.25s}.sheet.open{transform:translateY(0)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.item{border:0;border-radius:17px;background:#222925;color:#fff;padding:14px}.toast{position:fixed;z-index:1600;left:50%;bottom:105px;transform:translate(-50%,30px);background:#101713;color:#fff;padding:11px 16px;border-radius:15px;opacity:0;transition:.2s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}.userDot{width:25px;height:25px;border-radius:50%;background:#28cf69;border:5px solid #fff;box-shadow:0 0 0 7px #28cf6940}.event{width:31px;height:31px;border-radius:50%;background:#ed3d42;border:3px solid #fff;display:grid;place-items:center}.hazard{position:fixed;z-index:1300;right:14px;top:88px;width:150px;background:#fff;border-radius:20px;padding:13px;box-shadow:0 8px 28px #0003;display:none}.hazard.show{display:block}@media(min-width:800px){.top{left:24px}.results{left:85px}.panel,.card,.route,.navTop,.navBottom{left:24px;right:auto;width:410px}}@media(max-width:480px){.top{left:10px;right:10px}.brand,.account{width:48px;height:48px;border-radius:16px}.search{height:48px}.results{top:68px}.row{grid-template-columns:1fr 1fr}.hazard{top:76px;right:10px}.modalBack{padding:12px}.addressModal{padding:18px;border-radius:23px}}</style></head><body><div id="map"></div><div id="normal"><div class="top"><div class="brand">S</div><div class="searchbox"><input id="search" class="search" placeholder="Dokąd jedziemy?" autocomplete="off"></div><button id="account" class="account">👤</button></div><div id="results" class="results"></div><div class="side"><button id="locate" class="circle">◎</button><button id="report" class="circle report">!</button></div><div class="bottom"><div class="speed"><strong id="speed">0</strong><small>km/h</small></div><div class="logo">Staniek <b>Maps</b></div></div></div><div id="profile" class="panel"><h3>Twoje miejsca</h3><div class="profileSub">Zapisz miejsca, do których często jeździsz.</div><button id="google" class="google">G &nbsp; Zaloguj przez Google</button><div class="places"><button id="home">🏠 Ustaw Dom</button><button id="work">💼 Ustaw Pracę</button></div><button id="profileX" class="close">Zamknij</button></div><div id="addressBack" class="modalBack"><div class="addressModal"><div class="modalHead"><div id="addressIcon" class="modalIcon">🏠</div><div><h2 id="addressTitle">Ustaw Dom</h2><p>Wpisz dokładny adres. Numer mieszkania jest opcjonalny.</p></div></div><div class="field"><label>Miejscowość *</label><input id="placeCity" placeholder="np. Ełk" autocomplete="address-level2"></div><div class="field"><label>Ulica *</label><input id="placeStreet" placeholder="np. Mickiewicza" autocomplete="street-address"></div><div class="row"><div class="field"><label>Nr domu *</label><input id="placeNumber" placeholder="12"></div><div class="field"><label>Nr mieszkania</label><input id="placeFlat" placeholder="5"></div></div><div class="modalBtns"><button id="addressCancel" class="modalCancel">Anuluj</button><button id="addressSave" class="modalSave">Zapisz adres</button></div></div></div><div id="card" class="card"><div id="placeName" class="title"></div><div id="placeAddr" class="address"></div><button id="go" class="green">🚗 Wyznacz trasę</button></div><div id="route" class="route"><div><strong id="rTime">--</strong><div id="rDist">--</div><span id="rDest"></span></div><button id="start" class="start">Rozpocznij trasę 🔊</button><button id="routeX" class="close">Anuluj trasę</button></div><div id="navTop" class="navTop"><div id="turn">↑</div><div><strong id="maneuverDist">--</strong><div id="maneuverText">Jedź prosto</div></div></div><div id="navBottom" class="navBottom"><div><strong id="navTime">--</strong><small id="navRemain">--</small></div><button id="stop">Zakończ</button></div><div id="hazard" class="hazard"><b id="hazardName">Kontrola</b><div id="hazardDist"></div></div><div id="sheet" class="sheet"><h3>Zgłoś na drodze</h3><div class="grid"><button class="item" data-type="Kontrola prędkości" data-icon="🚓">🚓 Kontrola</button><button class="item" data-type="Fotoradar" data-icon="📷">📷 Fotoradar</button><button class="item" data-type="Wypadek" data-icon="💥">💥 Wypadek</button><button class="item" data-type="Roboty" data-icon="🚧">🚧 Roboty</button></div><button id="sheetX" class="close">Anuluj</button></div><div id="toast" class="toast"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const $=x=>document.getElementById(x),map=L.map('map',{zoomControl:false}).setView([52.05,19.25],6);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);let pos,userMarker,dest,routeData,routeLayer,steps=[],stepIndex=0,navigating=false,reports=[],homeMarker,workMarker,addressType='home';const dot=L.divIcon({className:'',html:'<div class="userDot"></div>',iconSize:[25,25],iconAnchor:[12,12]});const homeIcon=L.divIcon({className:'',html:'<div class="homeMarker">🏠</div>',iconSize:[42,42],iconAnchor:[21,21]});const workIcon=L.divIcon({className:'',html:'<div class="workMarker">💼</div>',iconSize:[42,42],iconAnchor:[21,21]});function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2300)}function distance(a,b){const R=6371000,p1=a[0]*Math.PI/180,p2=b[0]*Math.PI/180,dp=(b[0]-a[0])*Math.PI/180,dl=(b[1]-a[1])*Math.PI/180,x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}function fmt(m){return m<950?Math.max(10,Math.round(m/10)*10)+' m':(m/1000).toFixed(1)+' km'}function timeFmt(s){let m=Math.max(1,Math.round(s/60));if(m<60)return m+' min';return Math.floor(m/60)+' h '+(m%60?m%60+' min':'')}function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='pl-PL';speechSynthesis.speak(u)}}function showSavedMarker(p,type,zoom=false){let icon=type==='home'?homeIcon:workIcon;if(type==='home'&&homeMarker)map.removeLayer(homeMarker);if(type==='work'&&workMarker)map.removeLayer(workMarker);let marker=L.marker([p.lat,p.lon],{icon}).addTo(map).bindPopup(`<b>${type==='home'?'🏠 Dom':'💼 Praca'}</b><br>${p.address}`);if(type==='home')homeMarker=marker;else workMarker=marker;if(zoom)map.flyTo([p.lat,p.lon],17)}['home','work'].forEach(t=>{let p=JSON.parse(localStorage.getItem(t==='home'?'staniekHome':'staniekWork')||'null');if(p)showSavedMarker(p,t)});navigator.geolocation?.watchPosition(p=>{pos=[p.coords.latitude,p.coords.longitude];if(!userMarker)userMarker=L.marker(pos,{icon:dot}).addTo(map);else userMarker.setLatLng(pos);$('speed').textContent=p.coords.speed?Math.round(p.coords.speed*3.6):0;if(navigating)updateNav()});$('locate').onclick=()=>pos&&map.flyTo(pos,17);$('account').onclick=()=>{$('results').style.display='none';$('profile').classList.add('open')};$('profileX').onclick=()=>$('profile').classList.remove('open');$('google').onclick=()=>toast('Logowanie Google podłączymy później');function openAddress(type){addressType=type;$('profile').classList.remove('open');let key=type==='home'?'staniekHome':'staniekWork',p=JSON.parse(localStorage.getItem(key)||'null');$('addressIcon').textContent=type==='home'?'🏠':'💼';$('addressTitle').textContent=type==='home'?'Ustaw Dom':'Ustaw Pracę';$('placeCity').value=p?.city||'';$('placeStreet').value=p?.street||'';$('placeNumber').value=p?.number||'';$('placeFlat').value=p?.flat||'';$('addressBack').classList.add('open');setTimeout(()=>$('placeCity').focus(),150)}$('home').onclick=()=>openAddress('home');$('work').onclick=()=>openAddress('work');$('addressCancel').onclick=()=>$('addressBack').classList.remove('open');$('addressBack').onclick=e=>{if(e.target===$('addressBack'))$('addressBack').classList.remove('open')};$('addressSave').onclick=async()=>{let city=$('placeCity').value.trim(),street=$('placeStreet').value.trim(),number=$('placeNumber').value.trim(),flat=$('placeFlat').value.trim();if(!city||!street||!number)return toast('Uzupełnij miejscowość, ulicę i numer domu');let q=`${street} ${number}, ${city}, Polska`;$('addressSave').disabled=true;$('addressSave').textContent='Szukam adresu…';try{let d=await(await fetch('https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=1&countrycodes=pl&q='+encodeURIComponent(q),{headers:{'Accept-Language':'pl'}})).json();if(!d.length){toast('Nie znaleziono adresu — sprawdź dane');return}let label=addressType==='home'?'Dom':'Praca',p={lat:+d[0].lat,lon:+d[0].lon,name:label,city,street,number,flat,address:`${street} ${number}${flat?' / '+flat:''}, ${city}`};localStorage.setItem(addressType==='home'?'staniekHome':'staniekWork',JSON.stringify(p));showSavedMarker(p,addressType,true);$('addressBack').classList.remove('open');toast('✓ '+label+' zapisany na mapie')}catch(e){toast('Nie udało się wyszukać adresu')}finally{$('addressSave').disabled=false;$('addressSave').textContent='Zapisz adres'}};function showQuick(){let h=JSON.parse(localStorage.getItem('staniekHome')||'null'),w=JSON.parse(localStorage.getItem('staniekWork')||'null');$('results').innerHTML='<div class="quick"><button id="qh">🏠 Dom</button><button id="qw">💼 Praca</button></div>';$('results').style.display='block';$('qh').onclick=()=>h?select(h):openAddress('home');$('qw').onclick=()=>w?select(w):openAddress('work')}$('search').onfocus=showQuick;let timer;$('search').oninput=()=>{clearTimeout(timer);let q=$('search').value.trim();if(q.length<2)return showQuick();timer=setTimeout(async()=>{try{let d=await(await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=6&countrycodes=pl&q='+encodeURIComponent(q),{headers:{'Accept-Language':'pl'}})).json();$('results').innerHTML=d.map((x,i)=>`<div class="result" data-i="${i}"><b>📍 ${x.display_name.split(',')[0]}</b><br><small>${x.display_name}</small></div>`).join('');$('results').style.display='block';[...$('results').children].forEach(e=>e.onclick=()=>select(d[+e.dataset.i]))}catch(e){}},300)};function select(x){dest={lat:+x.lat,lon:+x.lon,name:x.name||x.display_name?.split(',')[0]||'Miejsce',address:x.address||x.display_name||''};$('results').style.display='none';$('search').value=dest.name;$('placeName').textContent=dest.name;$('placeAddr').textContent=dest.address;$('card').classList.add('open');map.flyTo([dest.lat,dest.lon],16)}$('go').onclick=async()=>{if(!pos||!dest)return toast('Włącz lokalizację');$('card').classList.remove('open');try{let j=await(await fetch(`https://router.project-osrm.org/route/v1/driving/${pos[1]},${pos[0]};${dest.lon},${dest.lat}?overview=full&geometries=geojson&steps=true`)).json();routeData=j.routes[0];steps=routeData.legs.flatMap(x=>x.steps);routeLayer&&map.removeLayer(routeLayer);routeLayer=L.geoJSON(routeData.geometry,{style:{color:'#20c866',weight:7}}).addTo(map);map.fitBounds(routeLayer.getBounds(),{padding:[55,55]});$('rTime').textContent=timeFmt(routeData.duration);$('rDist').textContent=fmt(routeData.distance);$('rDest').textContent=dest.name;$('route').classList.add('open')}catch(e){toast('Nie udało się wyznaczyć trasy')}};$('start').onclick=()=>{navigating=true;stepIndex=steps.length>1?1:0;$('route').classList.remove('open');$('normal').style.display='none';$('navTop').classList.add('open');$('navBottom').classList.add('open');speak('Nawigacja rozpoczęta');updateNav()};function updateNav(){if(!pos||!steps.length)return;let s=steps[stepIndex],p=[s.maneuver.location[1],s.maneuver.location[0]],d=distance(pos,p);if(d<25&&stepIndex<steps.length-1){s=steps[++stepIndex];p=[s.maneuver.location[1],s.maneuver.location[0]];d=distance(pos,p)}$('maneuverDist').textContent=fmt(d);$('maneuverText').textContent=s.name?'Jedź w '+s.name:'Jedź wyznaczoną trasą';$('navTime').textContent=timeFmt(routeData.duration);$('navRemain').textContent=fmt(routeData.distance)+' do celu';map.setView(pos,18)}function stop(){navigating=false;$('normal').style.display='';$('navTop').classList.remove('open');$('navBottom').classList.remove('open');if(routeLayer){map.removeLayer(routeLayer);routeLayer=null}}$('stop').onclick=stop;$('routeX').onclick=stop;$('report').onclick=()=>$('sheet').classList.add('open');$('sheetX').onclick=()=>$('sheet').classList.remove('open');document.querySelectorAll('.item').forEach(b=>b.onclick=()=>{if(!pos)return toast('Włącz lokalizację');let e={type:b.dataset.type,icon:b.dataset.icon,lat:pos[0],lon:pos[1],time:Date.now()};reports.push(e);localStorage.setItem('staniekReports',JSON.stringify(reports));L.marker(pos,{icon:L.divIcon({className:'',html:`<div class="event">${e.icon}</div>`})}).addTo(map);$('sheet').classList.remove('open');toast('✓ Zgłoszono '+e.type);speak('Zgłosiłeś '+e.type)});try{reports=JSON.parse(localStorage.getItem('staniekReports')||'[]')}catch(e){}</script></body></html>

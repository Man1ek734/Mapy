<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#101513"><title>Staniek Maps</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body,#map{height:100%;margin:0}body{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden;color:#152019}button,input{font:inherit}.leaflet-control-zoom{display:none}.leaflet-control-attribution{font-size:8px}.leaflet-tile-pane{filter:saturate(.82) brightness(1.03)}.top{position:fixed;z-index:1000;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:8px}.brand,.account{width:50px;height:50px;border:0;border-radius:17px;display:grid;place-items:center;box-shadow:0 5px 20px #0003}.brand{background:#101513;color:#35dc72;font-size:23px;font-weight:950}.account{background:#fff;font-size:20px}.searchbox{position:relative;flex:1}.search{width:100%;height:50px;border:0;border-radius:17px;background:#fff;padding:0 44px 0 17px;font-size:15px;font-weight:750;outline:0;box-shadow:0 5px 20px #0002}.results{position:fixed;z-index:1110;top:70px;left:12px;right:12px;background:#fff;border-radius:22px;box-shadow:0 12px 35px #0004;max-height:60vh;overflow:auto;display:none;padding:7px}.quick{display:flex;gap:7px;padding:5px}.quick button{flex:1;border:0;border-radius:14px;background:#eef5f0;padding:10px;font-weight:800}.result{display:flex;align-items:center;gap:11px;padding:12px;border-radius:15px}.resultIcon{width:39px;height:39px;border-radius:13px;background:#edf8f1;display:grid;place-items:center}.resultText{min-width:0}.resultText b,.resultText small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.resultText small{color:#768079;margin-top:3px}.side{position:fixed;z-index:1000;right:12px;bottom:108px;display:grid;gap:8px}.circle{width:50px;height:50px;border:0;border-radius:17px;background:#fff;box-shadow:0 4px 18px #0003;font-size:21px}.report{background:#ed3d42;color:#fff;font-weight:900}.bottom{position:fixed;z-index:1000;left:12px;bottom:max(12px,env(safe-area-inset-bottom));display:flex;gap:9px}.speed{width:72px;height:72px;border-radius:22px;background:#101513ed;color:#fff;display:grid;place-content:center;text-align:center}.speed strong{font-size:28px}.speed small{font-size:10px}.logo{background:#fff;padding:17px;border-radius:18px;font-weight:850;box-shadow:0 4px 18px #0003}.logo b{color:#20bf60}.panel,.card,.route,.sheet{position:fixed;z-index:1200;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));border-radius:24px;padding:17px;box-shadow:0 10px 35px #0005;background:#fff;display:none}.panel.open,.card.open,.route.open{display:block}.panel h3,.sheet h3{margin:0 0 13px}.profileRow{display:flex;align-items:center;gap:10px;margin-bottom:12px}.avatar{width:44px;height:44px;border-radius:50%;background:#eaf8ef;display:grid;place-items:center;font-size:20px}.profileRow b{display:block}.profileRow small{color:#77817b}.google{width:100%;border:1px solid #ddd;background:#fff;border-radius:15px;padding:12px;font-weight:800}.places{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.places button{border:0;border-radius:15px;padding:13px;background:#eef5f0;font-weight:800}.close{width:100%;border:0;border-radius:14px;background:#eee;padding:11px;margin-top:10px}.title{font-size:19px;font-weight:900}.address{font-size:12px;color:#747c77;margin:5px 0 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.green{width:100%;border:0;border-radius:16px;background:#20c866;color:#fff;padding:14px;font-weight:900}.route{background:#101513;color:#fff}.routeInfo{display:flex;justify-content:space-between;margin-bottom:12px}.routeInfo strong{font-size:22px;color:#3ae079}.route button{width:100%;border:0;border-radius:15px;padding:13px;font-weight:900}.start{background:#27cb67;color:#fff}.cancel{background:transparent!important;color:#aaa}.navTop{position:fixed;z-index:1250;left:10px;right:10px;top:max(10px,env(safe-area-inset-top));background:#101513;color:#fff;border-radius:22px;padding:14px;display:none;align-items:center;gap:14px}.navTop.open,.navBottom.open{display:flex}.turn{font-size:39px;min-width:44px;text-align:center;color:#3ae079}.instruction strong{font-size:21px;display:block}.instruction span{font-size:14px;color:#c4cbc7}.navBottom{position:fixed;z-index:1250;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));background:#101513;color:#fff;border-radius:22px;padding:12px 14px;display:none;align-items:center;justify-content:space-between}.navBottom strong{color:#3ae079;font-size:19px}.navBottom small{display:block;color:#b9c0bc}.stop{border:0;border-radius:14px;background:#313936;color:#fff;padding:11px 14px;font-weight:800}.sheet{display:block;background:#111714;color:#fff;transform:translateY(130%);transition:.25s}.sheet.open{transform:translateY(0)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.item{border:0;border-radius:17px;background:#222925;color:#fff;padding:14px 4px;font-weight:750}.item span{display:block;font-size:25px}.toast{position:fixed;z-index:1450;left:50%;bottom:105px;transform:translate(-50%,30px);background:#101513;color:#fff;padding:11px 16px;border-radius:15px;opacity:0;transition:.2s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}.userDot{width:25px;height:25px;border-radius:50%;background:#28cf69;border:5px solid #fff;box-shadow:0 0 0 7px #28cf6940,0 3px 9px #0005}.event{width:31px;height:31px;border-radius:50%;background:#ed3d42;border:3px solid #fff;color:#fff;display:grid;place-items:center}.building{fill:#d8ddd9;stroke:#b9c1bc;stroke-width:1}.hazard{position:fixed;z-index:1300;right:10px;top:86px;width:150px;background:#fff;border-radius:20px;padding:12px;box-shadow:0 7px 28px #0004;display:none}.hazard.show{display:block}.hazard strong{display:block}.hazardDist{font-size:20px;font-weight:950;color:#e3393f}.limit{width:38px;height:38px;border:4px solid #e13a3f;border-radius:50%;display:grid;place-items:center;font-weight:950;margin-top:7px}@media(min-width:800px){.top{left:24px;right:auto;width:500px}.results{left:24px;right:auto;width:500px}.panel,.card,.route,.navTop,.navBottom{left:24px;right:auto;width:410px}.sheet{left:auto;right:20px;width:390px}}</style></head><body><div id="map"></div><div id="normal"><div class="top"><div class="brand">S</div><div class="searchbox"><input id="search" class="search" placeholder="Dokąd jedziemy?" autocomplete="off"></div><button id="account" class="account">👤</button></div><div id="results" class="results"></div><div class="side"><button id="locate" class="circle">◎</button><button id="report" class="circle report">!</button></div><div class="bottom"><div class="speed"><strong id="speed">0</strong><small>km/h</small></div><div class="logo">Staniek <b>Maps</b></div></div></div><div id="profile" class="panel"><h3>Twoje konto</h3><div id="profileInfo" class="profileRow"><div class="avatar">👤</div><div><b>Staniek Maps</b><small>Zaloguj się, aby synchronizować miejsca</small></div></div><button id="google" class="google">G&nbsp;&nbsp; Zaloguj przez Google</button><div class="places"><button id="home">🏠 Ustaw Dom</button><button id="work">💼 Ustaw Pracę</button></div><button id="profileX" class="close">Zamknij</button></div><div id="card" class="card"><div id="placeName" class="title"></div><div id="placeAddr" class="address"></div><button id="go" class="green">🚗 Wyznacz trasę</button></div><div id="route" class="route"><div class="routeInfo"><div><strong id="rTime">--</strong><br><span id="rDist">--</span></div><span id="rDest"></span></div><button id="start" class="start">Rozpocznij trasę 🔊</button><button id="routeX" class="cancel">Anuluj trasę</button></div><div id="navTop" class="navTop"><div id="turn" class="turn">↑</div><div class="instruction"><strong id="maneuverDist">--</strong><span id="maneuverText">Jedź prosto</span></div></div><div id="navBottom" class="navBottom"><div><strong id="navTime">--</strong><small id="navRemain">-- do celu</small></div><button id="stop" class="stop">Zakończ</button></div><div id="hazard" class="hazard"><div>🚓</div><strong id="hazardName">Kontrola prędkości</strong><div id="hazardDist" class="hazardDist">1000 m</div><div id="hazardLimit" class="limit">50</div></div><div id="sheet" class="sheet"><h3>Zgłoś na drodze</h3><div class="grid"><button class="item" data-type="Kontrola prędkości" data-icon="🚓"><span>🚓</span>Kontrola prędkości</button><button class="item" data-type="Fotoradar" data-icon="📷"><span>📷</span>Fotoradar</button><button class="item" data-type="Wypadek" data-icon="💥"><span>💥</span>Wypadek</button><button class="item" data-type="Roboty drogowe" data-icon="🚧"><span>🚧</span>Roboty</button></div><button id="sheetX" class="close">Anuluj</button></div><div id="toast" class="toast"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const $=x=>document.getElementById(x),map=L.map('map',{zoomControl:false,preferCanvas:true}).setView([52.05,19.25],6);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);let pos,userMarker,dest,routeData,routeLayer,navigating=false,steps=[],stepIndex=0,lastSpoken=-1,reports=[];const dot=L.divIcon({className:'',html:'<div class="userDot"></div>',iconSize:[25,25],iconAnchor:[12,12]});function dist(a,b){const R=6371000,p1=a[0]*Math.PI/180,p2=b[0]*Math.PI/180,dp=(b[0]-a[0])*Math.PI/180,dl=(b[1]-a[1])*Math.PI/180,x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}function fmt(m){return m<950?Math.max(10,Math.round(m/10)*10)+' m':(m/1000).toFixed(1)+' km'}function timeFmt(sec){let min=Math.max(1,Math.round(sec/60));if(min<60)return min+' min';const h=Math.floor(min/60),m=min%60;return h+' h '+(m?m+' min':'')}function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='pl-PL';u.rate=.95;speechSynthesis.speak(u)}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}function maneuver(s){let m=s.maneuver||{},mod=m.modifier||'',n=s.name?' w '+s.name:'';if(m.type==='arrive')return['●','Cel'];if(m.type==='roundabout'||m.type==='rotary')return['↻','Wjedź na rondo'+n];if(mod.includes('left'))return['←','Skręć w lewo'+n];if(mod.includes('right'))return['→','Skręć w prawo'+n];return['↑','Jedź prosto'+n]}function updateNav(){if(!navigating||!pos||!steps.length)return;let s=steps[stepIndex],p=[s.maneuver.location[1],s.maneuver.location[0]],d=dist(pos,p);while(d<25&&stepIndex<steps.length-1){s=steps[++stepIndex];p=[s.maneuver.location[1],s.maneuver.location[0]];d=dist(pos,p);lastSpoken=-1}let m=maneuver(s);$('turn').textContent=m[0];$('maneuverDist').textContent=fmt(d);$('maneuverText').textContent=m[1];let remain=d;for(let i=stepIndex;i<steps.length;i++)remain+=steps[i].distance||0;$('navRemain').textContent=fmt(remain)+' do celu';$('navTime').textContent=timeFmt(routeData.duration*(remain/routeData.distance));if(d<500&&lastSpoken!==stepIndex){speak('Za '+fmt(d)+', '+m[1]);lastSpoken=stepIndex}map.setView(pos,18,{animate:true});checkReports()}function gps(center=false){if(!navigator.geolocation)return;navigator.geolocation.watchPosition(p=>{pos=[p.coords.latitude,p.coords.longitude];if(!userMarker)userMarker=L.marker(pos,{icon:dot}).addTo(map);else userMarker.setLatLng(pos);$('speed').textContent=p.coords.speed==null?0:Math.max(0,Math.round(p.coords.speed*3.6));if(center)map.flyTo(pos,17);updateNav();checkReports()},()=>{}, {enableHighAccuracy:true,maximumAge:700})}$('locate').onclick=()=>gps(true);gps(false);let timer;$('search').onfocus=()=>showQuick();function showQuick(){let home=JSON.parse(localStorage.getItem('staniekHome')||'null'),work=JSON.parse(localStorage.getItem('staniekWork')||'null');$('results').innerHTML='<div class="quick"><button id="qh">🏠 Dom</button><button id="qw">💼 Praca</button></div>';$('results').style.display='block';$('qh').onclick=()=>home?select(home):toast('Najpierw ustaw Dom');$('qw').onclick=()=>work?select(work):toast('Najpierw ustaw Pracę')}$('search').oninput=()=>{clearTimeout(timer);let q=$('search').value.trim();if(q.length<2){showQuick();return}timer=setTimeout(async()=>{let data=await (await fetch('https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=7&countrycodes=pl&q='+encodeURIComponent(q),{headers:{'Accept-Language':'pl'}})).json();$('results').innerHTML=data.map((x,i)=>`<div class="result" data-i="${i}"><div class="resultIcon">📍</div><div class="resultText"><b>${x.name||x.display_name.split(',')[0]}</b><small>${x.display_name}</small></div></div>`).join('');$('results').style.display='block';[...$('results').children].forEach(e=>e.onclick=()=>select(data[+e.dataset.i]))},300)};function select(x){dest={lat:+x.lat,lon:+x.lon,name:x.name||x.display_name.split(',')[0],address:x.address||x.display_name};$('search').value=dest.name;$('results').style.display='none';$('placeName').textContent=dest.name;$('placeAddr').textContent=dest.address;$('card').classList.add('open');map.flyTo([dest.lat,dest.lon],16)}$('go').onclick=()=>buildRoute();async function buildRoute(){if(!pos||!dest)return toast('Włącz lokalizację');$('card').classList.remove('open');try{let j=await (await fetch(`https://router.project-osrm.org/route/v1/driving/${pos[1]},${pos[0]};${dest.lon},${dest.lat}?overview=full&geometries=geojson&steps=true`)).json();routeData=j.routes[0];steps=routeData.legs.flatMap(x=>x.steps);if(routeLayer)map.removeLayer(routeLayer);routeLayer=L.geoJSON(routeData.geometry,{style:{color:'#20c866',weight:7,opacity:.94}}).addTo(map);map.fitBounds(routeLayer.getBounds(),{padding:[55,55]});$('rTime').textContent=timeFmt(routeData.duration);$('rDist').textContent=fmt(routeData.distance);$('rDest').textContent=dest.name;$('route').classList.add('open')}catch(e){toast('Nie udało się wyznaczyć trasy')}}$('start').onclick=()=>{navigating=true;stepIndex=steps.length>1?1:0;$('route').classList.remove('open');$('normal').style.display='none';$('navTop').classList.add('open');$('navBottom').classList.add('open');map.setView(pos,18);speak('Nawigacja rozpoczęta');updateNav()};function clearRoute(){navigating=false;$('navTop').classList.remove('open');$('navBottom').classList.remove('open');$('normal').style.display='';if(routeLayer){map.removeLayer(routeLayer);routeLayer=null}}$('stop').onclick=clearRoute;$('routeX').onclick=clearRoute;$('report').onclick=()=>$('sheet').classList.add('open');$('sheetX').onclick=()=>$('sheet').classList.remove('open');function addReport(e,save=true){reports.push(e);let ic=L.divIcon({className:'',html:`<div class="event">${e.icon}</div>`});L.marker([e.lat,e.lon],{icon:ic}).addTo(map);if(save)localStorage.setItem('staniekReports',JSON.stringify(reports))}document.querySelectorAll('.item').forEach(b=>b.onclick=()=>{if(!pos)return toast('Włącz lokalizację');let e={id:Date.now(),type:b.dataset.type,icon:b.dataset.icon,lat:pos[0],lon:pos[1],time:Date.now(),speedLimit:50};addReport(e);$('sheet').classList.remove('open');toast('✓ Zgłoszono: '+e.type);speak('Zgłosiłeś '+e.type)});function checkReports(){if(!pos)return;let n=null,dn=Infinity;reports.forEach(e=>{let d=dist(pos,[e.lat,e.lon]);if(d<dn&&Date.now()-e.time>15000){n=e;dn=d}});if(n&&dn<1200){$('hazard').classList.add('show');$('hazardName').textContent=n.type;$('hazardDist').textContent=fmt(dn);$('hazardLimit').textContent=n.speedLimit||50}else $('hazard').classList.remove('show')}try{JSON.parse(localStorage.getItem('staniekReports')||'[]').forEach(e=>addReport(e,false))}catch(e){}$('account').onclick=()=>$('profile').classList.add('open');$('profileX').onclick=()=>$('profile').classList.remove('open');$('google').onclick=()=>toast('Logowanie Google wymaga podłączenia Firebase/Supabase');function setPlace(k,label){if(!pos)return toast('Włącz lokalizację');let p={lat:pos[0],lon:pos[1],name:label,address:'Zapisana lokalizacja'};localStorage.setItem(k,JSON.stringify(p));toast('✓ Ustawiono: '+label)}$('home').onclick=()=>setPlace('staniekHome','Dom');$('work').onclick=()=>setPlace('staniekWork','Praca');</script></body></html>

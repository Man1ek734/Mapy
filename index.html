<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#101513"><title>Staniek Maps</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}html,body,#map{height:100%;margin:0}body{font-family:Inter,system-ui,sans-serif;overflow:hidden;color:#152019}button,input{font:inherit}.leaflet-control-zoom{display:none}.top{position:fixed;z-index:1000;top:12px;left:12px;right:12px;display:flex;gap:8px}.brand,.account{width:50px;height:50px;border:0;border-radius:17px;display:grid;place-items:center;box-shadow:0 5px 20px #0003}.brand{background:#101513;color:#35dc72;font-size:23px;font-weight:950}.account{background:#fff}.searchbox{flex:1}.search{width:100%;height:50px;border:0;border-radius:17px;padding:0 16px;font-weight:750;box-shadow:0 5px 20px #0002}.results{position:fixed;z-index:1110;top:70px;left:12px;right:12px;background:#fff;border-radius:22px;padding:7px;display:none;box-shadow:0 12px 35px #0004}.quick{display:flex;gap:7px}.quick button{flex:1;border:0;border-radius:14px;background:#eef5f0;padding:12px;font-weight:800}.result{padding:12px;border-radius:14px}.side{position:fixed;z-index:1000;right:12px;bottom:108px;display:grid;gap:8px}.circle{width:50px;height:50px;border:0;border-radius:17px;background:#fff;box-shadow:0 4px 18px #0003}.report{background:#ed3d42;color:#fff}.bottom{position:fixed;z-index:1000;left:12px;bottom:12px;display:flex;gap:9px}.speed{width:72px;height:72px;border-radius:22px;background:#101513;color:#fff;display:grid;place-content:center;text-align:center}.speed strong{font-size:28px}.logo{background:#fff;padding:17px;border-radius:18px;font-weight:850}.logo b{color:#20bf60}.panel,.card,.route,.sheet,.addressPanel{position:fixed;z-index:1200;left:10px;right:10px;bottom:10px;border-radius:24px;padding:17px;box-shadow:0 10px 35px #0005;background:#fff;display:none}.panel.open,.card.open,.route.open,.addressPanel.open{display:block}.panel h3,.addressPanel h3,.sheet h3{margin:0 0 13px}.places{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.places button,.google,.close{border:0;border-radius:15px;padding:13px;font-weight:800}.google{width:100%;background:#fff;border:1px solid #ddd}.places button{background:#eef5f0}.close{width:100%;background:#eee;margin-top:10px}.field{margin-bottom:10px}.field label{font-size:12px;font-weight:800;color:#657069;display:block;margin:0 0 5px 3px}.field input{width:100%;height:47px;border:1px solid #dfe5e1;border-radius:14px;padding:0 13px;outline:none}.field input:focus{border-color:#24c866;box-shadow:0 0 0 3px #24c86620}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.save{width:100%;border:0;border-radius:15px;background:#20c866;color:#fff;padding:14px;font-weight:900}.title{font-size:19px;font-weight:900}.address{font-size:12px;color:#747c77;margin:5px 0 14px}.green{width:100%;border:0;border-radius:16px;background:#20c866;color:#fff;padding:14px;font-weight:900}.route{background:#101513;color:#fff}.routeInfo{display:flex;justify-content:space-between}.routeInfo strong{color:#3ae079;font-size:21px}.route button{width:100%;border:0;border-radius:15px;padding:13px;margin-top:9px;font-weight:900}.start{background:#27cb67;color:#fff}.navTop,.navBottom{position:fixed;z-index:1250;left:10px;right:10px;background:#101513;color:#fff;border-radius:22px;padding:14px;display:none}.navTop{top:10px}.navBottom{bottom:10px}.navTop.open,.navBottom.open{display:flex;justify-content:space-between}.turn{font-size:35px;color:#3ae079}.sheet{display:block;background:#111714;color:#fff;transform:translateY(130%);transition:.25s}.sheet.open{transform:translateY(0)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.item{border:0;border-radius:17px;background:#222925;color:#fff;padding:14px}.toast{position:fixed;z-index:1500;left:50%;bottom:105px;transform:translate(-50%,30px);background:#101513;color:#fff;padding:11px 16px;border-radius:15px;opacity:0;transition:.2s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}.userDot{width:25px;height:25px;border-radius:50%;background:#28cf69;border:5px solid #fff;box-shadow:0 0 0 7px #28cf6940}.homeMarker{width:42px;height:42px;border-radius:15px;background:#fff;display:grid;place-items:center;font-size:24px;border:3px solid #20c866;box-shadow:0 4px 14px #0004}.event{width:31px;height:31px;border-radius:50%;background:#ed3d42;border:3px solid #fff;display:grid;place-items:center}.hazard{position:fixed;z-index:1300;right:10px;top:86px;width:150px;background:#fff;border-radius:20px;padding:12px;display:none}.hazard.show{display:block}@media(min-width:800px){.top{width:500px;left:24px;right:auto}.results,.panel,.card,.route,.addressPanel,.navTop,.navBottom{left:24px;right:auto;width:410px}}</style></head><body><div id="map"></div><div id="normal"><div class="top"><div class="brand">S</div><div class="searchbox"><input id="search" class="search" placeholder="Dokąd jedziemy?"></div><button id="account" class="account">👤</button></div><div id="results" class="results"></div><div class="side"><button id="locate" class="circle">◎</button><button id="report" class="circle report">!</button></div><div class="bottom"><div class="speed"><strong id="speed">0</strong><small>km/h</small></div><div class="logo">Staniek <b>Maps</b></div></div></div><div id="profile" class="panel"><h3>Twoje konto</h3><button id="google" class="google">G &nbsp; Zaloguj przez Google</button><div class="places"><button id="home">🏠 Ustaw Dom</button><button id="work">💼 Ustaw Pracę</button></div><button id="profileX" class="close">Zamknij</button></div><div id="addressPanel" class="addressPanel"><h3>🏠 Ustaw adres domu</h3><div class="field"><label>Miejscowość</label><input id="homeCity" placeholder="np. Ełk"></div><div class="field"><label>Ulica</label><input id="homeStreet" placeholder="np. Mickiewicza"></div><div class="row"><div class="field"><label>Numer domu</label><input id="homeNumber" placeholder="12"></div><div class="field"><label>Nr mieszkania</label><input id="homeFlat" placeholder="5"></div></div><button id="saveHome" class="save">Zapisz Dom</button><button id="addressX" class="close">Anuluj</button></div><div id="card" class="card"><div id="placeName" class="title"></div><div id="placeAddr" class="address"></div><button id="go" class="green">🚗 Wyznacz trasę</button></div><div id="route" class="route"><div class="routeInfo"><div><strong id="rTime">--</strong><div id="rDist">--</div></div><span id="rDest"></span></div><button id="start" class="start">Rozpocznij trasę 🔊</button><button id="routeX" class="close">Anuluj trasę</button></div><div id="navTop" class="navTop"><div id="turn" class="turn">↑</div><div><strong id="maneuverDist">--</strong><div id="maneuverText">Jedź prosto</div></div></div><div id="navBottom" class="navBottom"><div><strong id="navTime">--</strong><small id="navRemain">--</small></div><button id="stop">Zakończ</button></div><div id="hazard" class="hazard"><b id="hazardName">Kontrola</b><div id="hazardDist"></div></div><div id="sheet" class="sheet"><h3>Zgłoś na drodze</h3><div class="grid"><button class="item" data-type="Kontrola prędkości" data-icon="🚓">🚓 Kontrola</button><button class="item" data-type="Fotoradar" data-icon="📷">📷 Fotoradar</button><button class="item" data-type="Wypadek" data-icon="💥">💥 Wypadek</button><button class="item" data-type="Roboty" data-icon="🚧">🚧 Roboty</button></div><button id="sheetX" class="close">Anuluj</button></div><div id="toast" class="toast"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const $=x=>document.getElementById(x),map=L.map('map',{zoomControl:false}).setView([52.05,19.25],6);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);let pos,userMarker,dest,routeData,routeLayer,steps=[],stepIndex=0,navigating=false,reports=[],homeMarker;const dot=L.divIcon({className:'',html:'<div class="userDot"></div>',iconSize:[25,25]});const homeIcon=L.divIcon({className:'',html:'<div class="homeMarker">🏠</div>',iconSize:[42,42],iconAnchor:[21,21]});function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2300)}function distance(a,b){const R=6371000,p1=a[0]*Math.PI/180,p2=b[0]*Math.PI/180,dp=(b[0]-a[0])*Math.PI/180,dl=(b[1]-a[1])*Math.PI/180,x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}function fmt(m){return m<950?Math.round(m/10)*10+' m':(m/1000).toFixed(1)+' km'}function timeFmt(s){let m=Math.round(s/60);if(m<60)return m+' min';return Math.floor(m/60)+' h '+(m%60?m%60+' min':'')}function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='pl-PL';speechSynthesis.speak(u)}}function showHomeMarker(h,zoom=false){if(homeMarker)map.removeLayer(homeMarker);homeMarker=L.marker([h.lat,h.lon],{icon:homeIcon}).addTo(map).bindPopup('<b>🏠 Dom</b><br>'+h.address);if(zoom)map.flyTo([h.lat,h.lon],17)}let savedHome=JSON.parse(localStorage.getItem('staniekHome')||'null');if(savedHome)showHomeMarker(savedHome);navigator.geolocation?.watchPosition(p=>{pos=[p.coords.latitude,p.coords.longitude];if(!userMarker)userMarker=L.marker(pos,{icon:dot}).addTo(map);else userMarker.setLatLng(pos);$('speed').textContent=p.coords.speed?Math.round(p.coords.speed*3.6):0;if(navigating)updateNav();checkReports()});$('locate').onclick=()=>pos&&map.flyTo(pos,17);$('account').onclick=()=>$('profile').classList.add('open');$('profileX').onclick=()=>$('profile').classList.remove('open');$('google').onclick=()=>toast('Logowanie Google podłączymy przez Firebase/Supabase');$('home').onclick=()=>{$('profile').classList.remove('open');let h=JSON.parse(localStorage.getItem('staniekHome')||'null');if(h){$('homeCity').value=h.city||'';$('homeStreet').value=h.street||'';$('homeNumber').value=h.number||'';$('homeFlat').value=h.flat||''}$('addressPanel').classList.add('open')};$('addressX').onclick=()=>$('addressPanel').classList.remove('open');$('saveHome').onclick=async()=>{let city=$('homeCity').value.trim(),street=$('homeStreet').value.trim(),number=$('homeNumber').value.trim(),flat=$('homeFlat').value.trim();if(!city||!street||!number)return toast('Wpisz miejscowość, ulicę i numer domu');let query=`${street} ${number}, ${city}, Polska`;toast('Szukam adresu…');try{let data=await (await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=pl&q='+encodeURIComponent(query),{headers:{'Accept-Language':'pl'}})).json();if(!data.length)return toast('Nie znaleziono tego adresu');let h={lat:+data[0].lat,lon:+data[0].lon,name:'Dom',city,street,number,flat,address:`${street} ${number}${flat?', mieszkanie '+flat:''}, ${city}`};localStorage.setItem('staniekHome',JSON.stringify(h));showHomeMarker(h,true);$('addressPanel').classList.remove('open');toast('✓ Dom zapisany na mapie')}catch(e){toast('Nie udało się wyszukać adresu')}};$('work').onclick=()=>toast('Adres pracy zrobimy tak samo jak Dom');function showQuick(){let h=JSON.parse(localStorage.getItem('staniekHome')||'null');$('results').innerHTML='<div class="quick"><button id="qh">🏠 Dom</button><button>💼 Praca</button></div>';$('results').style.display='block';$('qh').onclick=()=>h?select(h):$('home').click()}$('search').onfocus=showQuick;let timer;$('search').oninput=()=>{clearTimeout(timer);let q=$('search').value.trim();if(q.length<2)return showQuick();timer=setTimeout(async()=>{let d=await(await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=6&countrycodes=pl&q='+encodeURIComponent(q))).json();$('results').innerHTML=d.map((x,i)=>`<div class="result" data-i="${i}"><b>📍 ${x.display_name.split(',')[0]}</b><br><small>${x.display_name}</small></div>`).join('');$('results').style.display='block';[...$('results').children].forEach(e=>e.onclick=()=>select(d[+e.dataset.i]))},300)};function select(x){dest={lat:+x.lat,lon:+x.lon,name:x.name||x.display_name?.split(',')[0]||'Dom',address:x.address||x.display_name||''};$('results').style.display='none';$('search').value=dest.name;$('placeName').textContent=dest.name;$('placeAddr').textContent=dest.address;$('card').classList.add('open');map.flyTo([dest.lat,dest.lon],16)}$('go').onclick=async()=>{if(!pos||!dest)return toast('Włącz lokalizację');$('card').classList.remove('open');try{let j=await(await fetch(`https://router.project-osrm.org/route/v1/driving/${pos[1]},${pos[0]};${dest.lon},${dest.lat}?overview=full&geometries=geojson&steps=true`)).json();routeData=j.routes[0];steps=routeData.legs.flatMap(x=>x.steps);routeLayer&&map.removeLayer(routeLayer);routeLayer=L.geoJSON(routeData.geometry,{style:{color:'#20c866',weight:7}}).addTo(map);map.fitBounds(routeLayer.getBounds());$('rTime').textContent=timeFmt(routeData.duration);$('rDist').textContent=fmt(routeData.distance);$('rDest').textContent=dest.name;$('route').classList.add('open')}catch(e){toast('Błąd trasy')}};$('start').onclick=()=>{navigating=true;stepIndex=steps.length>1?1:0;$('route').classList.remove('open');$('normal').style.display='none';$('navTop').classList.add('open');$('navBottom').classList.add('open');speak('Nawigacja rozpoczęta');updateNav()};function updateNav(){if(!pos||!steps.length)return;let s=steps[stepIndex],p=[s.maneuver.location[1],s.maneuver.location[0]],d=distance(pos,p);if(d<25&&stepIndex<steps.length-1)s=steps[++stepIndex];$('maneuverDist').textContent=fmt(d);$('maneuverText').textContent=s.name?'Jedź w '+s.name:'Jedź wyznaczoną trasą';$('navTime').textContent=timeFmt(routeData.duration);$('navRemain').textContent=fmt(routeData.distance)+' do celu';map.setView(pos,18)}function stop(){navigating=false;$('normal').style.display='';$('navTop').classList.remove('open');$('navBottom').classList.remove('open');routeLayer&&map.removeLayer(routeLayer)}$('stop').onclick=stop;$('routeX').onclick=stop;$('report').onclick=()=>$('sheet').classList.add('open');$('sheetX').onclick=()=>$('sheet').classList.remove('open');document.querySelectorAll('.item').forEach(b=>b.onclick=()=>{if(!pos)return toast('Włącz lokalizację');let e={type:b.dataset.type,icon:b.dataset.icon,lat:pos[0],lon:pos[1],time:Date.now()};reports.push(e);localStorage.setItem('staniekReports',JSON.stringify(reports));L.marker(pos,{icon:L.divIcon({className:'',html:`<div class="event">${e.icon}</div>`})}).addTo(map);$('sheet').classList.remove('open');toast('✓ Zgłoszono '+e.type);speak('Zgłosiłeś '+e.type)});function checkReports(){}try{reports=JSON.parse(localStorage.getItem('staniekReports')||'[]')}catch(e){}</script></body></html>

<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f7f6"><title>Staniek Maps</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}html,body,#map{height:100%;margin:0}body{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden;color:#18201c}.leaflet-control-zoom{display:none}.leaflet-control-attribution{font-size:9px;background:#ffffffb8!important}.leaflet-tile-pane{filter:saturate(.78) contrast(.96) brightness(1.035)}.top{position:fixed;z-index:1000;left:14px;right:14px;top:max(14px,env(safe-area-inset-top));display:flex;gap:9px}.brand{height:54px;min-width:54px;border-radius:17px;background:#101513;color:#35dc72;display:grid;place-items:center;font-weight:950;font-size:24px;box-shadow:0 4px 18px #15251b30;border:1px solid #ffffff1c}.searchWrap{height:54px;flex:1;position:relative}.search{width:100%;height:100%;border:0;border-radius:17px;background:#fff;color:#151a17;box-shadow:0 4px 18px #15251b30;padding:0 46px 0 18px;font-size:16px;font-weight:700;outline:none}.searchIcon{position:absolute;right:16px;top:15px;font-size:20px;color:#657069}.results{position:fixed;z-index:1100;left:77px;right:14px;top:77px;background:#fff;border-radius:17px;overflow:hidden;box-shadow:0 9px 30px #10201638;display:none}.result{padding:13px 15px;border-bottom:1px solid #edf0ee;cursor:pointer;font-size:14px}.result:last-child{border:0}.right{position:fixed;z-index:1000;right:14px;bottom:116px;display:flex;flex-direction:column;gap:9px}.round{width:52px;height:52px;border:0;border-radius:17px;background:#fff;color:#172019;box-shadow:0 4px 18px #15251b35;font-size:22px;cursor:pointer}.report{background:#ed3d42;color:#fff;font-weight:900}.bottom{position:fixed;z-index:1000;left:14px;right:14px;bottom:max(16px,env(safe-area-inset-bottom));height:76px;display:flex;align-items:center;gap:10px;pointer-events:none}.speed{height:76px;min-width:76px;border-radius:22px;background:#101513ed;color:#fff;box-shadow:0 5px 22px #0004;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto}.speed strong{font-size:29px;line-height:27px}.speed small{font-size:10px;color:#b9c0bc;margin-top:6px}.status{height:60px;border-radius:19px;background:#fff;box-shadow:0 4px 18px #15251b35;padding:0 17px;display:flex;align-items:center;gap:9px;font-weight:800;pointer-events:auto}.statusDot{width:9px;height:9px;background:#36df75;border-radius:50%;box-shadow:0 0 0 4px #36df7526}.status b{color:#20b85b}.sheet{position:fixed;z-index:1200;left:10px;right:10px;bottom:10px;background:#111714;color:#fff;border-radius:26px;padding:18px;box-shadow:0 -10px 40px #0006;transform:translateY(130%);transition:.25s}.sheet.open{transform:translateY(0)}.sheet h3{margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.item{border:0;border-radius:17px;background:#222925;color:#fff;padding:14px 5px;font-weight:700}.item span{display:block;font-size:24px;margin-bottom:5px}.close{width:100%;margin-top:11px;border:0;border-radius:15px;padding:13px;background:#303733;color:#fff;font-weight:700}.user-arrow{width:28px;height:28px;transform:rotate(0deg);filter:drop-shadow(0 3px 4px #0004)}.user-arrow:before{content:'';display:block;width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-bottom:28px solid #20c866;filter:drop-shadow(0 0 0 white)}.poi-pin{width:22px;height:22px;border-radius:50% 50% 50% 0;background:#20c866;transform:rotate(-45deg);border:3px solid white;box-shadow:0 3px 10px #0005}.poi-pin:after{content:'';position:absolute;width:6px;height:6px;background:white;border-radius:50%;left:5px;top:5px}@media(min-width:800px){.top{left:24px;right:auto;width:430px}.results{left:87px;right:auto;width:367px}.right{right:24px}.bottom{left:24px}.sheet{left:auto;right:20px;width:390px}}</style></head><body><div id="map"></div><div class="top"><div class="brand">S</div><div class="searchWrap"><input id="search" class="search" placeholder="Dokąd jedziemy?" autocomplete="off"><span class="searchIcon">⌕</span></div></div><div id="results" class="results"></div><div class="right"><button id="locate" class="round" title="Moja lokalizacja">➤</button><button id="report" class="round report" title="Zgłoś">!</button></div><div class="bottom"><div class="speed"><strong id="speed">0</strong><small>km/h</small></div><div class="status"><span class="statusDot"></span>Staniek <b>Maps</b></div></div><div id="sheet" class="sheet"><h3>Co chcesz zgłosić?</h3><div class="grid"><button class="item"><span>🚓</span>Kontrola</button><button class="item"><span>📷</span>Fotoradar</button><button class="item"><span>⚠️</span>Utrudnienie</button><button class="item"><span>💥</span>Wypadek</button><button class="item"><span>🚧</span>Roboty</button><button class="item"><span>⛔</span>Zamknięcie</button></div><button id="close" class="close">Anuluj</button></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const map=L.map('map',{zoomControl:false,attributionControl:true,preferCanvas:true}).setView([52.05,19.25],6);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);let userMarker=null,watchId=null;const userIcon=L.divIcon({className:'',html:'<div class="user-arrow"></div>',iconSize:[28,28],iconAnchor:[14,14]});function startGPS(center=false){if(!navigator.geolocation){alert('Ta przeglądarka nie obsługuje GPS.');return}if(watchId===null){watchId=navigator.geolocation.watchPosition(p=>{const{latitude,longitude,speed,heading}=p.coords;if(!userMarker)userMarker=L.marker([latitude,longitude],{icon:userIcon}).addTo(map);else userMarker.setLatLng([latitude,longitude]);if(heading!=null&&userMarker._icon){const a=userMarker._icon.querySelector('.user-arrow');if(a)a.style.transform=`rotate(${heading}deg)`}document.getElementById('speed').textContent=speed==null?'0':Math.max(0,Math.round(speed*3.6));if(center){map.flyTo([latitude,longitude],16,{duration:.7});center=false}},()=>{}, {enableHighAccuracy:true,maximumAge:1000,timeout:10000})}else if(userMarker)map.flyTo(userMarker.getLatLng(),16,{duration:.7})}document.getElementById('locate').onclick=()=>startGPS(true);startGPS(false);const sheet=document.getElementById('sheet');document.getElementById('report').onclick=()=>sheet.classList.add('open');document.getElementById('close').onclick=()=>sheet.classList.remove('open');let searchMarker=null,timer;const input=document.getElementById('search'),results=document.getElementById('results');input.addEventListener('input',()=>{clearTimeout(timer);const q=input.value.trim();if(q.length<3){results.style.display='none';return}timer=setTimeout(async()=>{try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=5&countrycodes=pl&q='+encodeURIComponent(q),{headers:{'Accept-Language':'pl'}});const data=await r.json();results.innerHTML=data.map((x,i)=>`<div class="result" data-i="${i}"><b>${x.name||x.display_name.split(',')[0]}</b><br><span style="color:#737c77;font-size:12px">${x.display_name}</span></div>`).join('');results.style.display=data.length?'block':'none';[...results.children].forEach(el=>el.onclick=()=>{const x=data[+el.dataset.i],ll=[+x.lat,+x.lon];if(searchMarker)map.removeLayer(searchMarker);searchMarker=L.marker(ll).addTo(map).bindPopup(`<b>${x.name||x.display_name.split(',')[0]}</b><br>${x.display_name}`).openPopup();map.flyTo(ll,16,{duration:.7});input.value=x.name||x.display_name.split(',')[0];results.style.display='none'})}catch(e){results.style.display='none'}},450)});document.addEventListener('click',e=>{if(!e.target.closest('.top')&&!e.target.closest('.results'))results.style.display='none'});</script></body></html>

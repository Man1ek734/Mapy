<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#101513"><title>Staniek Maps</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body,#map{height:100%;margin:0}body{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden;color:#18201c;background:#e9eeeb}.leaflet-control-zoom{display:none}.leaflet-control-attribution{font-size:8px;background:#ffffffb5!important}.leaflet-tile-pane{filter:saturate(.78) contrast(.97) brightness(1.035)}button,input{font:inherit}.top{position:fixed;z-index:1000;left:12px;right:12px;top:max(12px,env(safe-area-inset-top));display:flex;gap:8px}.brand{height:52px;min-width:52px;border-radius:17px;background:#101513;color:#35dc72;display:grid;place-items:center;font-weight:950;font-size:23px;box-shadow:0 4px 18px #15251b30}.searchWrap{height:52px;flex:1;position:relative}.search{width:100%;height:100%;border:0;border-radius:17px;background:#fff;color:#151a17;box-shadow:0 4px 18px #15251b30;padding:0 44px 0 17px;font-size:16px;font-weight:700;outline:none}.searchIcon{position:absolute;right:15px;top:14px;font-size:20px;color:#657069}.results{position:fixed;z-index:1100;left:72px;right:12px;top:72px;background:#fff;border-radius:17px;overflow:hidden;box-shadow:0 9px 30px #10201638;display:none;max-height:55vh;overflow-y:auto}.result{padding:13px 14px;border-bottom:1px solid #edf0ee;cursor:pointer;font-size:14px}.result:last-child{border:0}.right{position:fixed;z-index:1000;right:12px;bottom:112px;display:flex;flex-direction:column;gap:8px}.round{width:50px;height:50px;border:0;border-radius:16px;background:#fff;color:#172019;box-shadow:0 4px 18px #15251b35;font-size:21px;cursor:pointer}.report{background:#ed3d42;color:#fff;font-weight:900}.bottom{position:fixed;z-index:1000;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));height:72px;display:flex;align-items:center;gap:9px;pointer-events:none}.speed{height:72px;min-width:72px;border-radius:21px;background:#101513ed;color:#fff;box-shadow:0 5px 22px #0004;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto}.speed strong{font-size:28px;line-height:26px}.speed small{font-size:10px;color:#b9c0bc;margin-top:6px}.status{height:58px;border-radius:18px;background:#fff;box-shadow:0 4px 18px #15251b35;padding:0 15px;display:flex;align-items:center;gap:8px;font-weight:800;pointer-events:auto}.statusDot{width:9px;height:9px;background:#36df75;border-radius:50%;box-shadow:0 0 0 4px #36df7526}.status b{color:#20b85b}.placeCard{position:fixed;z-index:1150;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));background:#fff;border-radius:24px;padding:17px;box-shadow:0 10px 35px #10201645;display:none}.placeCard.open{display:block}.placeTitle{font-size:19px;font-weight:900;margin-right:35px}.placeAddress{font-size:12px;color:#727a75;margin:5px 0 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:flex;gap:9px}.go{flex:1;border:0;border-radius:16px;background:#20c866;color:#fff;padding:14px;font-weight:900;font-size:16px}.cancelPlace{width:48px;border:0;border-radius:16px;background:#edf1ef;font-size:20px}.routeBar{position:fixed;z-index:1160;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));background:#101513;color:#fff;border-radius:24px;padding:15px;box-shadow:0 10px 35px #0006;display:none}.routeBar.open{display:block}.routeStats{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.routeStats strong{font-size:21px;color:#3ae079}.routeStats span{font-size:13px;color:#c2c9c5}.start{width:100%;border:0;border-radius:16px;background:#27cb67;color:#fff;padding:14px;font-weight:950;font-size:16px}.routeCancel{width:100%;border:0;background:transparent;color:#b9c1bc;padding:11px 0 0;font-weight:700}.navTop{position:fixed;z-index:1170;left:10px;right:10px;top:max(10px,env(safe-area-inset-top));background:#101513;color:#fff;border-radius:22px;padding:15px;box-shadow:0 6px 26px #0005;display:none}.navTop.open{display:flex;align-items:center;gap:13px}.turn{font-size:34px;color:#3ae079}.navText{min-width:0}.navText strong{display:block;font-size:18px}.navText span{display:block;font-size:12px;color:#b9c1bc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.navBottom{position:fixed;z-index:1170;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));background:#101513;color:#fff;border-radius:22px;padding:12px 14px;display:none;align-items:center;justify-content:space-between;box-shadow:0 6px 26px #0005}.navBottom.open{display:flex}.navInfo strong{display:block;color:#3ae079;font-size:18px}.navInfo span{font-size:11px;color:#b9c1bc}.stop{border:0;border-radius:14px;background:#313936;color:#fff;padding:11px 14px;font-weight:800}.sheet{position:fixed;z-index:1200;left:10px;right:10px;bottom:10px;background:#111714;color:#fff;border-radius:26px;padding:18px;box-shadow:0 -10px 40px #0006;transform:translateY(130%);transition:.25s}.sheet.open{transform:translateY(0)}.sheet h3{margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.item{border:0;border-radius:17px;background:#222925;color:#fff;padding:14px 5px;font-weight:700}.item span{display:block;font-size:24px;margin-bottom:5px}.close{width:100%;margin-top:11px;border:0;border-radius:15px;padding:13px;background:#303733;color:#fff;font-weight:700}.user-arrow{width:28px;height:28px;filter:drop-shadow(0 3px 4px #0004)}.user-arrow:before{content:'';display:block;width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-bottom:28px solid #20c866}.destination{width:25px;height:25px;border-radius:50% 50% 50% 0;background:#ed3d42;transform:rotate(-45deg);border:3px solid white;box-shadow:0 3px 10px #0005}.destination:after{content:'';position:absolute;width:7px;height:7px;background:#fff;border-radius:50%;left:6px;top:6px}@media(max-width:420px){.brand{height:48px;min-width:48px;border-radius:15px}.searchWrap{height:48px}.top{gap:7px}.results{left:67px;top:67px}.search{font-size:15px}.right{bottom:105px}.round{width:47px;height:47px}.status{padding:0 12px;font-size:14px}.grid{grid-template-columns:repeat(2,1fr)}}@media(min-width:800px){.top{left:24px;right:auto;width:430px}.results{left:84px;right:auto;width:370px}.right{right:24px}.bottom{left:24px}.placeCard,.routeBar,.navTop,.navBottom{left:24px;right:auto;width:410px}.sheet{left:auto;right:20px;width:390px}}</style></head><body><div id="map"></div><div id="normalUI"><div class="top"><div class="brand">S</div><div class="searchWrap"><input id="search" class="search" placeholder="Dokąd jedziemy?" autocomplete="off"><span class="searchIcon">⌕</span></div></div><div id="results" class="results"></div><div class="right"><button id="locate" class="round">➤</button><button id="report" class="round report">!</button></div><div class="bottom"><div class="speed"><strong id="speed">0</strong><small>km/h</small></div><div class="status"><span class="statusDot"></span>Staniek <b>Maps</b></div></div></div><div id="placeCard" class="placeCard"><div id="placeTitle" class="placeTitle"></div><div id="placeAddress" class="placeAddress"></div><div class="actions"><button id="go" class="go">🚗 Wyznacz trasę</button><button id="cancelPlace" class="cancelPlace">×</button></div></div><div id="routeBar" class="routeBar"><div class="routeStats"><div><strong id="routeTime">--</strong><br><span id="routeDistance">--</span></div><span id="routeDest"></span></div><button id="start" class="start">Rozpocznij trasę</button><button id="routeCancel" class="routeCancel">Anuluj trasę</button></div><div id="navTop" class="navTop"><div class="turn">↑</div><div class="navText"><strong>Jedź wyznaczoną trasą</strong><span id="navDest"></span></div></div><div id="navBottom" class="navBottom"><div class="navInfo"><strong id="navTime">--</strong><span id="navDistance">--</span></div><button id="stop" class="stop">Zakończ</button></div><div id="sheet" class="sheet"><h3>Co chcesz zgłosić?</h3><div class="grid"><button class="item"><span>🚓</span>Kontrola</button><button class="item"><span>📷</span>Fotoradar</button><button class="item"><span>⚠️</span>Utrudnienie</button><button class="item"><span>💥</span>Wypadek</button><button class="item"><span>🚧</span>Roboty</button><button class="item"><span>⛔</span>Zamknięcie</button></div><button id="close" class="close">Anuluj</button></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const map=L.map('map',{zoomControl:false,attributionControl:true,preferCanvas:true}).setView([52.05,19.25],6);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);let userMarker=null,userPos=null,watchId=null,destination=null,destMarker=null,routeLayer=null,routeData=null,navigating=false;const userIcon=L.divIcon({className:'',html:'<div class="user-arrow"></div>',iconSize:[28,28],iconAnchor:[14,14]}),destIcon=L.divIcon({className:'',html:'<div class="destination"></div>',iconSize:[25,25],iconAnchor:[12,25]});function startGPS(center=false){if(!navigator.geolocation){alert('Ta przeglądarka nie obsługuje GPS.');return}if(watchId===null){watchId=navigator.geolocation.watchPosition(p=>{const{latitude,longitude,speed,heading}=p.coords;userPos=[latitude,longitude];if(!userMarker)userMarker=L.marker(userPos,{icon:userIcon}).addTo(map);else userMarker.setLatLng(userPos);if(heading!=null&&userMarker._icon){const a=userMarker._icon.querySelector('.user-arrow');if(a)a.style.transform=`rotate(${heading}deg)`}document.getElementById('speed').textContent=speed==null?'0':Math.max(0,Math.round(speed*3.6));if(center){map.flyTo(userPos,16,{duration:.6});center=false}if(navigating)map.panTo(userPos,{animate:true,duration:.4})},()=>{}, {enableHighAccuracy:true,maximumAge:1000,timeout:10000})}else if(userMarker){userPos=[userMarker.getLatLng().lat,userMarker.getLatLng().lng];map.flyTo(userPos,16,{duration:.6})}}document.getElementById('locate').onclick=()=>startGPS(true);startGPS(false);const sheet=document.getElementById('sheet');document.getElementById('report').onclick=()=>sheet.classList.add('open');document.getElementById('close').onclick=()=>sheet.classList.remove('open');const input=document.getElementById('search'),results=document.getElementById('results'),placeCard=document.getElementById('placeCard');let timer;input.addEventListener('input',()=>{clearTimeout(timer);const q=input.value.trim();if(q.length<3){results.style.display='none';return}timer=setTimeout(async()=>{try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=5&countrycodes=pl&q='+encodeURIComponent(q),{headers:{'Accept-Language':'pl'}});const data=await r.json();results.innerHTML=data.map((x,i)=>`<div class="result" data-i="${i}"><b>${x.name||x.display_name.split(',')[0]}</b><br><span style="color:#737c77;font-size:12px">${x.display_name}</span></div>`).join('');results.style.display=data.length?'block':'none';[...results.children].forEach(el=>el.onclick=()=>selectPlace(data[+el.dataset.i]))}catch(e){results.style.display='none'}},450)});function selectPlace(x){destination={lat:+x.lat,lon:+x.lon,name:x.name||x.display_name.split(',')[0],address:x.display_name};if(destMarker)map.removeLayer(destMarker);destMarker=L.marker([destination.lat,destination.lon],{icon:destIcon}).addTo(map);map.flyTo([destination.lat,destination.lon],16,{duration:.6});input.value=destination.name;results.style.display='none';document.getElementById('placeTitle').textContent=destination.name;document.getElementById('placeAddress').textContent=destination.address;placeCard.classList.add('open')}document.getElementById('cancelPlace').onclick=()=>placeCard.classList.remove('open');document.getElementById('go').onclick=async()=>{if(!destination)return;if(!userPos){navigator.geolocation.getCurrentPosition(p=>{userPos=[p.coords.latitude,p.coords.longitude];buildRoute()},()=>alert('Aby wyznaczyć trasę, zezwól Staniek Maps na dostęp do lokalizacji.'),{enableHighAccuracy:true,timeout:10000});return}buildRoute()};async function buildRoute(){placeCard.classList.remove('open');const url=`https://router.project-osrm.org/route/v1/driving/${userPos[1]},${userPos[0]};${destination.lon},${destination.lat}?overview=full&geometries=geojson&steps=true`;try{const r=await fetch(url),j=await r.json();if(!j.routes||!j.routes.length)throw 0;routeData=j.routes[0];if(routeLayer)map.removeLayer(routeLayer);routeLayer=L.geoJSON(routeData.geometry,{style:{color:'#20c866',weight:7,opacity:.92,lineCap:'round',lineJoin:'round'}}).addTo(map);map.fitBounds(routeLayer.getBounds(),{padding:[55,55]});const mins=Math.max(1,Math.round(routeData.duration/60)),km=routeData.distance/1000;document.getElementById('routeTime').textContent=mins+' min';document.getElementById('routeDistance').textContent=(km<10?km.toFixed(1):Math.round(km))+' km';document.getElementById('routeDest').textContent=destination.name;document.getElementById('routeBar').classList.add('open')}catch(e){alert('Nie udało się wyznaczyć trasy. Spróbuj ponownie.')}}document.getElementById('routeCancel').onclick=clearRoute;function clearRoute(){navigating=false;if(routeLayer){map.removeLayer(routeLayer);routeLayer=null}document.getElementById('routeBar').classList.remove('open');document.getElementById('navTop').classList.remove('open');document.getElementById('navBottom').classList.remove('open');document.getElementById('normalUI').style.display='';if(destination)map.flyTo([destination.lat,destination.lon],14,{duration:.5})}document.getElementById('start').onclick=()=>{if(!routeData)return;navigating=true;document.getElementById('routeBar').classList.remove('open');document.getElementById('normalUI').style.display='none';document.getElementById('navTop').classList.add('open');document.getElementById('navBottom').classList.add('open');document.getElementById('navDest').textContent=destination.name;document.getElementById('navTime').textContent=Math.max(1,Math.round(routeData.duration/60))+' min';const km=routeData.distance/1000;document.getElementById('navDistance').textContent=(km<10?km.toFixed(1):Math.round(km))+' km do celu';if(userPos)map.flyTo(userPos,17,{duration:.7})};document.getElementById('stop').onclick=clearRoute;document.addEventListener('click',e=>{if(!e.target.closest('.top')&&!e.target.closest('.results'))results.style.display='none'});</script></body></html>

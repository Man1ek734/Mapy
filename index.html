heetClose{width:39px;height:39px;border:0;border-radius:13px;background:#ffffff10;color:#fff;font-size:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.item{min-height:91px;border:1px solid #ffffff0c;border-radius:19px;background:#202923;color:#fff;padding:12px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font-size:12px;font-weight:800;transition:.15s}.item:hover{background:#29342d;transform:translateY(-2px)}.item:active{transform:scale(.97)}.item .ico{width:42px;height:42px;border-radius:14px;background:#ffffff0d;display:grid;place-items:center;font-size:23px}.sheetCancel{width:100%;height:47px;border:0;border-radius:16px;background:#ffffff0d;color:#d9e1dc;margin-top:11px;font-weight:850}.toast{position:fixed;z-index:1600;left:50%;bottom:105px;transform:translate(-50%,30px);background:#101713;color:#fff;padding:11px 16px;border-radius:15px;opacity:0;transition:.2s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}.userDot{width:25px;height:25px;border-radius:50%;background:#28cf69;border:5px solid #fff;box-shadow:0 0 0 7px #28cf6940}.event{width:31px;height:31px;border-radius:50%;background:#ed3d42;border:3px solid #fff;display:grid;place-items:center}.hazard{position:fixed;z-index:1300;right:14px;top:88px;width:150px;background:#fff;border-radius:20px;padding:13px;box-shadow:0 8px 28px #0003;display:none}.hazard.show{display:block}@media(min-width:800px){.top{left:24px}.results{left:85px}.panel,.card,.route,.navTop,.navBottom{left:24px;right:auto;width:410px}}@media(max-width:480px){.top{left:10px;right:10px}.brand,.account{width:48px;height:48px}.search{height:48px}.results{top:68px}.grid{grid-template-columns:repeat(2,1fr)}.item{min-height:82px}.sheet{border-radius:27px;padding:15px}.sheetSub{display:none}}</style></head><body><div id="map"></div><div id="normal"><div class="top"><div class="brand">S</div><div class="searchbox"><input id="search" class="search" placeholder="Dokąd ncel">Anuluj zgłoszenie</button></div><div id="toast" class="toast"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const $=x=>document.getElementById(x),map=L.map('map',{zoomControl:false}).setView([52.05,19.25],6);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);let pos,userMarker,dest,routeData,routeLayer,steps=[],stepIndex=0,navigating=false,reports=[],homeMarker,workMarker,addressType='home';const dot=L.divIcon({className:'',html:'<div class="userDot"></div>',iconSize:[25,25],iconAnchor:[12,12]}),homeIcon=L.divIcon({className:'',html:'<div class="homeMarker">🏠</div>',iconSize:[42,42],iconAnchor:[21,21]}),workIcon=L.divIcon({className:'',html:'<div class="workMarker">💼</div>',iconSize:[42,42],iconAnchor:[21,21]});function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2300)}function distance(a,b){const R=6371000,p1=a[0]*Math.PI/180,p2=b[0]*Math.PI/180,dp=(b[0]-a[0])*Math.PI/180,dl=(b[1]-a[1])*Math.PI/180,x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}function fmt(m){return m<950?Math.max(10,Math.round(m/10)*10)+' m':(m/1000).toFixed(1)+' km'}function timeFmt(s){let m=Math.max(1,Math.round(s/60));if(m<60)return m+' min';return Math.floor(m/60)+' h '+(m%60?m%60+' min':'')}function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='pl-PL';speechSynthesis.speak(u)}}function showSavedMarker(p,type,zoom=false){let icon=type==='home'?homeIcon:workIcon;if(type==='home'&&homeMarker)map.removeLayer(homeMarker);if(type==='work'&&workMarker)map.removeLayer(workMarker);let marker=L.marker([p.lat,p.lon],{icon}).addTo(map).bindPopup(`<b>${type==='home'?'🏠 Dom':'💼 Praca'}</b><br>${p.address}`);if(type==='home')homeMarker=marker;else workMarker=marker;if(zoom)map.flyTo([p.lat,p.lon],17)}['home','work'].forEach(t=>{let p=JSON.parse(localStorage.getItem(t==='home'?'staniekHome':'staniekWork')||'null');if(p)showSavedMarker(p,t)});navigator.geolocation?.watchPosition(p=>{pos=[p.coords.latitude,p.coords.longitude];if(!userMarker)userMarker=L.marker(pos,{icon:dot}).addTo(map);else userMarker.setLatLng(pos);$('speed').textContent=p.coords.speed?Math.round(p.coords.speed*3.6):0;if(navigating)updateNav()});$('locate').onclick=()=>pos&&map.flyTo(pos,17);$('account').onclick=()=>{$('results').style.display='none';$('profile').classList.add('open')};$('profileX').onclick=()=>$('profile').classList.remove('open');$('google').onclick=()=>toast('Logowanie Google podłączymy później');function openAddress(type){addressType=type;$('profile').classList.remove('open');let key=type==='home'?'staniekHome':'staniekWork',p=JSON.parse(localStorage.getItem(key)||'null');$('addressIcon').textContent=type==='home'?'🏠':'💼';$('addressTitle').textContent=type==='home'?'Ustaw Dom':'Ustaw Pracę';$('placeCity').value=p?.city||'';$('placeStreet').value=p?.street||'';$('placeNumber').value=p?.number||'';$('placeFlat').value=p?.flat||'';$('addressBack').classList.add('open')}$('home').onclick=()=>openAddress('home');$('work').onclick=()=>openAddress('work');$('addressCancel').onclick=()=>$('addressBack').classList.remove('open');$('addressSave').onclick=async()=>{let city=$('placeCity').value.trim(),street=$('placeStreet').value.trim(),number=$('placeNumber').value.trim(),flat=$('placeFlat').value.trim();if(!city||!street||!number)return toast('Uzupełnij miejscowość, ulicę i numer domu');try{let d=await(await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=pl&q='+encodeURIComponent(`${street} ${number}, ${city}, Polska`))).json();if(!d.length)return toast('Nie znaleziono adresu');let label=addressType==='home'?'Dom':'Praca',p={lat:+d[0].lat,lon:+d[0].lon,name:label,city,street,number,flat,address:`${street} ${number}${flat?' / '+flat:''}, ${city}`};localStorage.setItem(addressType==='home'?'staniekHome':'staniekWork',JSON.stringify(p));showSavedMarker(p,addressType,true);$('addressBack').classList.remove('open');toast('✓ '+label+' zapisany na mapie')}catch(e){toast('Nie udało się wyszukać adresu')}};function showQuick(){let h=JSON.parse(localStorage.getItem('staniekHome')||'null'),w=JSON.parse(localStorage.getItem('staniekWork')||'null');$('results').innerHTML='<div class="quick"><button id="qh">🏠 Dom</button><button id="qw">💼 Praca</button></div>';$('results').style.display='block';$('qh').onclick=()=>h?select(h):openAddress('home');$('qw').onclick=()=>w?select(w):openAddress('work')}$('search').onfocus=showQuick;let timer;$('search').oninput=()=>{clearTimeout(timer);let q=$('search').value.trim();if(q.length<2)return showQuick();timer=setTimeout(async()=>{let d=await(await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=6&countrycodes=pl&q='+encodeURIComponent(q))).json();$('results').innerHTML=d.map((x,i)=>`<div class="result" data-i="${i}"><b>📍 ${x.display_name.split(',')[0]}</b><br><small>${x.display_name}</small></div>`).join('');[...$('results').children].forEach(e=>e.onclick=()=>select(d[+e.dataset.i]))},300)};function select(x){dest={lat:+x.lat,lon:+x.lon,name:x.name||x.display_name?.split(',')[0]||'Miejsce',address:x.address||x.display_name||''};$('results').style.display='none';$('search').value=dest.name;$('placeName').textContent=dest.name;$('placeAddr').textContent=dest.address;$('card').classList.add('open');map.flyTo([dest.lat,dest.lon],16)}$('go').onclick=async()=>{if(!pos||!dest)return toast('Włącz lokalizację');$('card').classList.remove('open');try{let j=await(await fetch(`https://router.project-osrm.org/route/v1/driving/${pos[1]},${pos[0]};${dest.lon},${dest.lat}?overview=full&geometries=geojson&steps=true`)).json();routeData=j.routes[0];steps=routeData.legs.flatMap(x=>x.steps);routeLayer&&map.removeLayer(routeLayer);routeLayer=L.geoJSON(routeData.geometry,{style:{color:'#20c866',weight:7}}).addTo(map);map.fitBounds(routeLayer.getBounds(),{padding:[55,55]});$('rTime').textContent=timeFmt(routeData.duration);$('rDist').textContent=fmt(routeData.distance);$('rDest').textContent=dest.name;$('route').classList.add('open')}catch(e){toast('Nie udało się wyznaczyć trasy')}};$('start').onclick=()=>{navigating=true;stepIndex=steps.length>1?1:0;$('route').classList.remove('open');$('normal').style.display='none';$('navTop').classList.add('open');$('navBottom').classList.add('open');speak('Nawigacja rozpoczęta');updateNav()};function updateNav(){if(!pos||!steps.length)return;let s=steps[stepIndex],p=[s.maneuver.location[1],s.maneuver.location[0]],d=distance(pos,p);if(d<25&&stepIndex<steps.length-1){s=steps[++stepIndex];p=[s.maneuver.location[1],s.maneuver.location[0]];d=distance(pos,p)}$('maneuverDist').textContent=fmt(d);$('maneuverText').textContent=s.name?'Jedź w '+s.name:'Jedź wyznaczoną trasą';$('navTime').textContent=timeFmt(routeData.duration);$('navRemain').textContent=fmt(routeData.distance)+' do celu';map.setView(pos,18)}function stop(){navigating=false;$('normal').style.display='';$('navTop').classList.remove('open');$('navBottom').classList.remove('open');if(routeLayer){map.removeLayer(routeLayer);routeLayer=null}}$('stop').onclick=stop;$('routeX').onclick=stop;$('report').onclick=()=>$('sheet').classList.add('open');$('sheetX').onclick=$('sheetCancel').onclick=()=>$('sheet').classList.remove('open');document.querySelectorAll('.item').forEach(b=>b.onclick=()=>{if(!pos)return toast('Włącz lokalizację');let e={type:b.dataset.type,icon:b.dataset.icon,lat:pos[0],lon:pos[1],time:Date.now()};reports.push(e);localStorage.setItem('staniekReports',JSON.stringify(reports));L.marker(pos,{icon:L.divIcon({className:'',html:`<div class="event">${e.icon}</div>`})}).addTo(map);$('sheet').classList.remove('open');toast('✓ Zgłoszono: '+e.type);speak('Zgłosiłeś '+e.type)});try{reports=JSON.parse(localStorage.getItem('staniekReports')||'[]')}catch(e){}</script></body></html>

<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#101513"><title>Staniek Maps</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body,#map{height:100%;margin:0}body{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}.leaflet-control-zoom{display:none}.leaflet-control-attribution{font-size:8px}.leaflet-tile-pane{filter:saturate(.8) brightness(1.03)}button,input{font:inherit}.top{position:fixed;z-index:1000;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:8px}.brand{width:50px;height:50px;border-radius:16px;background:#101513;color:#35dc72;display:grid;place-items:center;font-size:23px;font-weight:950;box-shadow:0 4px 18px #0003}.searchbox{position:relative;flex:1}.search{width:100%;height:50px;border:0;border-radius:16px;background:#fff;padding:0 44px 0 16px;font-size:16px;font-weight:700;outline:0;box-shadow:0 4px 18px #0002}.searchbox span{position:absolute;right:15px;top:13px;font-size:21px}.results{position:fixed;z-index:1100;top:70px;left:70px;right:12px;background:#fff;border-radius:17px;box-shadow:0 8px 30px #0003;max-height:55vh;overflow:auto;display:none}.result{padding:13px;border-bottom:1px solid #eee;font-size:13px}.result b{font-size:14px}.side{position:fixed;z-index:1000;right:12px;bottom:110px;display:grid;gap:8px}.circle{width:49px;height:49px;border:0;border-radius:16px;background:#fff;box-shadow:0 4px 18px #0003;font-size:21px}.report{background:#ed3d42;color:#fff;font-weight:900}.bottom{position:fixed;z-index:1000;left:12px;bottom:max(12px,env(safe-area-inset-bottom));display:flex;gap:9px;align-items:center}.speed{width:72px;height:72px;border-radius:21px;background:#101513ed;color:#fff;display:grid;place-content:center;text-align:center;box-shadow:0 5px 22px #0004}.speed strong{font-size:28px;line-height:26px}.speed small{font-size:10px;color:#bbb;margin-top:5px}.logo{background:#fff;padding:17px;border-radius:18px;font-weight:850;box-shadow:0 4px 18px #0003}.logo b{color:#20bf60}.card,.route,.sheet{position:fixed;z-index:1200;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));border-radius:24px;padding:17px;box-shadow:0 10px 35px #0005;display:none}.card{background:#fff}.card.open,.route.open{display:block}.title{font-size:19px;font-weight:900}.address{font-size:12px;color:#747c77;margin:5px 0 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:flex;gap:8px}.green{flex:1;border:0;border-radius:16px;background:#20c866;color:#fff;padding:14px;font-weight:900}.x{width:48px;border:0;border-radius:16px;background:#edf1ef;font-size:20px}.route{background:#101513;color:#fff}.routeInfo{display:flex;justify-content:space-between;margin-bottom:12px}.routeInfo strong{font-size:21px;color:#3ae079}.routeInfo span{font-size:12px;color:#c1c8c4}.route button{width:100%;border:0;border-radius:15px;padding:13px;font-weight:900}.start{background:#27cb67;color:#fff}.cancel{background:transparent!important;color:#aaa;margin-top:3px}.navTop{position:fixed;z-index:1250;left:10px;right:10px;top:max(10px,env(safe-area-inset-top));background:#101513;color:#fff;border-radius:22px;padding:14px;display:none;align-items:center;gap:14px;box-shadow:0 6px 25px #0005}.navTop.open{display:flex}.turn{font-size:39px;min-width:44px;text-align:center;color:#3ae079}.instruction{min-width:0}.instruction strong{font-size:21px;display:block}.instruction span{font-size:14px;color:#c4cbc7;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.navBottom{position:fixed;z-index:1250;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));background:#101513;color:#fff;border-radius:22px;padding:12px 14px;display:none;align-items:center;justify-content:space-between}.navBottom.open{display:flex}.navBottom strong{color:#3ae079;font-size:19px}.navBottom small{display:block;color:#b9c0bc}.stop{border:0;border-radius:14px;background:#313936;color:#fff;padding:11px 14px;font-weight:800}.sheet{display:block;background:#111714;color:#fff;transform:translateY(130%);transition:.25s}.sheet.open{transform:translateY(0)}.sheet h3{margin:0 0 13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.item{border:0;border-radius:17px;background:#222925;color:#fff;padding:14px 4px;font-weight:750}.item span{display:block;font-size:25px;margin-bottom:4px}.sheetClose{width:100%;border:0;border-radius:15px;background:#303733;color:#fff;padding:12px;margin-top:10px;font-weight:800}.toast{position:fixed;z-index:1400;left:50%;bottom:105px;transform:translate(-50%,30px);background:#101513;color:#fff;padding:11px 16px;border-radius:15px;opacity:0;transition:.2s;white-space:nowrap;font-weight:750}.toast.show{opacity:1;transform:translate(-50%,0)}.user{width:28px;height:28px}.user:before{content:'';display:block;border-left:14px solid transparent;border-right:14px solid transparent;border-bottom:28px solid #20c866;filter:drop-shadow(0 2px 3px #0005)}.dest{width:24px;height:24px;background:#ed3d42;border:3px solid #fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg)}.event{width:30px;height:30px;border-radius:50%;background:#ed3d42;border:3px solid #fff;color:#fff;display:grid;place-items:center;font-size:15px;box-shadow:0 2px 7px #0005}@media(max-width:420px){.brand,.search{height:47px}.brand{width:47px}.results{left:67px;top:66px}.grid{grid-template-columns:repeat(2,1fr)}.instruction strong{font-size:19px}}@media(min-width:800px){.top{left:24px;right:auto;width:430px}.results{left:82px;right:auto;width:372px}.card,.route,.navTop,.navBottom{left:24px;right:auto;width:410px}.sheet{left:auto;right:20px;width:390px}.side{right:24px}}</style></head><body><div id="map"></div><div id="normal"><div class="top"><div class="brand">S</div><div class="searchbox"><input id="search" class="search" placeholder="Dokąd jedziemy?" autocomplete="off"><span>⌕</span></div></div><div id="results" class="results"></div><div class="side"><button id="locate" class="circle">➤</button><button id="report" class="circle report">!</button></div><div class="bottom"><div class="speed"><strong id="speed">0</strong><small>km/h</small></div><div class="logo">Staniek <b>Maps</b></div></div></div><div id="card" class="card"><div id="placeName" class="title"></div><div id="placeAddr" class="address"></div><div class="actions"><button id="go" class="green">🚗 Wyznacz trasę</button><button id="cardX" class="x">×</button></div></div><div id="route" class="route"><div class="routeInfo"><div><strong id="rTime">--</strong><br><span id="rDist">--</span></div><span id="rDest"></span></div><button id="start" class="start">Rozpocznij trasę 🔊</button><button id="routeX" class="cancel">Anuluj trasę</button></div><div id="navTop" class="navTop"><div id="turn" class="turn">↑</div><div class="instruction"><strong id="maneuverDist">-- m</strong><span id="maneuverText">Jedź prosto</span></div></div><div id="navBottom" class="navBottom"><div><strong id="navTime">--</strong><small id="navRemain">-- do celu</small></div><button id="stop" class="stop">Zakończ</button></div><div id="sheet" class="sheet"><h3>Zgłoś na drodze</h3><div class="grid"><button class="item" data-type="Kontrola" data-icon="🚓"><span>🚓</span>Kontrola</button><button class="item" data-type="Fotoradar" data-icon="📷"><span>📷</span>Fotoradar</button><button class="item" data-type="Utrudnienie" data-icon="⚠️"><span>⚠️</span>Utrudnienie</button><button class="item" data-type="Wypadek" data-icon="💥"><span>💥</span>Wypadek</button><button class="item" data-type="Roboty" data-icon="🚧"><span>🚧</span>Roboty</button><button class="item" data-type="Zamknięcie" data-icon="⛔"><span>⛔</span>Zamknięcie</button></div><button id="sheetX" class="sheetClose">Anuluj</button></div><div id="toast" class="toast"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const $=id=>document.getElementById(id),map=L.map('map',{zoomControl:false,preferCanvas:true}).setView([52.05,19.25],6);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);let pos=null,userMarker=null,watch=null,dest=null,destMarker=null,routeData=null,routeLayer=null,navigating=false,steps=[],stepIndex=0,lastSpoken=-1;const userIcon=L.divIcon({className:'',html:'<div class="user"></div>',iconSize:[28,28],iconAnchor:[14,14]}),destIcon=L.divIcon({className:'',html:'<div class="dest"></div>',iconSize:[24,24],iconAnchor:[12,24]});function distance(a,b){const R=6371000,p1=a[0]*Math.PI/180,p2=b[0]*Math.PI/180,dp=(b[0]-a[0])*Math.PI/180,dl=(b[1]-a[1])*Math.PI/180;const x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}function fmt(m){return m<950?Math.max(10,Math.round(m/10)*10)+' m':(m/1000).toFixed(m<10000?1:0)+' km'}function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='pl-PL';u.rate=.95;speechSynthesis.speak(u)}function maneuver(step){const m=step.maneuver||{},mod=m.modifier||'',name=step.name?' w '+step.name:'';if(m.type==='arrive')return['●','Cel jest na miejscu','Dojechałeś do celu'];if(m.type==='roundabout'||m.type==='rotary')return['↻','Wjedź na rondo'+name,'Wjedź na rondo'+name];if(mod.includes('left'))return['←','Skręć w lewo'+name,'Skręć w lewo'+name];if(mod.includes('right'))return['→','Skręć w prawo'+name,'Skręć w prawo'+name];if(mod==='uturn')return['↶','Zawróć'+name,'Zawróć'+name];return['↑','Jedź prosto'+name,'Jedź prosto'+name]}function updateNav(){if(!navigating||!pos||!steps.length)return;let s=steps[Math.min(stepIndex,steps.length-1)],loc=[s.maneuver.location[1],s.maneuver.location[0]],d=distance(pos,loc);while(d<25&&stepIndex<steps.length-1){stepIndex++;lastSpoken=-1;s=steps[stepIndex];loc=[s.maneuver.location[1],s.maneuver.location[0]];d=distance(pos,loc)}const m=maneuver(s);$('turn').textContent=m[0];$('maneuverDist').textContent=fmt(d);$('maneuverText').textContent=m[1];let remain=d;for(let i=stepIndex;i<steps.length;i++)remain+=steps[i].distance||0;$('navRemain').textContent=fmt(remain)+' do celu';const avg=Math.max(20,(routeData.distance/routeData.duration)*3.6),mins=Math.max(1,Math.round((remain/(avg/3.6))/60));$('navTime').textContent=mins+' min';if((d<550&&lastSpoken!==stepIndex*10+5)||(d<120&&lastSpoken!==stepIndex*10+1)){speak((d<120?'Za '+fmt(d)+', ':'Za '+fmt(d)+', ')+m[2]);lastSpoken=stepIndex*10+(d<120?1:5)}if(s.maneuver.type==='arrive'&&d<35){speak('Dojechałeś do celu');clearRoute()}map.panTo(pos,{animate:true,duration:.35})}function gps(center=false){if(!navigator.geolocation)return alert('Brak obsługi GPS');if(watch===null){watch=navigator.geolocation.watchPosition(p=>{pos=[p.coords.latitude,p.coords.longitude];if(!userMarker)userMarker=L.marker(pos,{icon:userIcon}).addTo(map);else userMarker.setLatLng(pos);if(p.coords.heading!=null&&userMarker._icon){const u=userMarker._icon.querySelector('.user');if(u)u.style.transform=`rotate(${p.coords.heading}deg)`}$('speed').textContent=p.coords.speed==null?0:Math.max(0,Math.round(p.coords.speed*3.6));if(center){map.flyTo(pos,16);center=false}updateNav()},()=>{}, {enableHighAccuracy:true,maximumAge:700,timeout:10000})}else if(pos)map.flyTo(pos,16)}$('locate').onclick=()=>gps(true);gps(false);let timer;$('search').oninput=()=>{clearTimeout(timer);const q=$('search').value.trim();if(q.length<3){$('results').style.display='none';return}timer=setTimeout(async()=>{try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=5&countrycodes=pl&q='+encodeURIComponent(q),{headers:{'Accept-Language':'pl'}}),data=await r.json();$('results').innerHTML=data.map((x,i)=>`<div class="result" data-i="${i}"><b>${x.name||x.display_name.split(',')[0]}</b><br>${x.display_name}</div>`).join('');$('results').style.display=data.length?'block':'none';[...$('results').children].forEach(e=>e.onclick=()=>select(data[+e.dataset.i]))}catch(e){}},400)};function select(x){dest={lat:+x.lat,lon:+x.lon,name:x.name||x.display_name.split(',')[0],address:x.display_name};if(destMarker)map.removeLayer(destMarker);destMarker=L.marker([dest.lat,dest.lon],{icon:destIcon}).addTo(map);map.flyTo([dest.lat,dest.lon],16);$('search').value=dest.name;$('results').style.display='none';$('placeName').textContent=dest.name;$('placeAddr').textContent=dest.address;$('card').classList.add('open')}$('cardX').onclick=()=>$('card').classList.remove('open');$('go').onclick=()=>{if(pos)buildRoute();else navigator.geolocation.getCurrentPosition(p=>{pos=[p.coords.latitude,p.coords.longitude];buildRoute()},()=>alert('Zezwól na lokalizację, aby wyznaczyć trasę.'),{enableHighAccuracy:true})};async function buildRoute(){if(!dest)return;$('card').classList.remove('open');try{const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${pos[1]},${pos[0]};${dest.lon},${dest.lat}?overview=full&geometries=geojson&steps=true`),j=await r.json();routeData=j.routes[0];steps=routeData.legs.flatMap(l=>l.steps);if(routeLayer)map.removeLayer(routeLayer);routeLayer=L.geoJSON(routeData.geometry,{style:{color:'#20c866',weight:7,opacity:.94,lineCap:'round'}}).addTo(map);map.fitBounds(routeLayer.getBounds(),{padding:[55,55]});$('rTime').textContent=Math.max(1,Math.round(routeData.duration/60))+' min';$('rDist').textContent=fmt(routeData.distance);$('rDest').textContent=dest.name;$('route').classList.add('open')}catch(e){alert('Nie udało się wyznaczyć trasy.')}}$('start').onclick=()=>{if(!routeData)return;navigating=true;stepIndex=steps.length>1?1:0;lastSpoken=-1;$('route').classList.remove('open');$('normal').style.display='none';$('navTop').classList.add('open');$('navBottom').classList.add('open');if(pos)map.flyTo(pos,17);speak('Nawigacja rozpoczęta. '+maneuver(steps[stepIndex])[2]);updateNav()};function clearRoute(){navigating=false;speechSynthesis&&speechSynthesis.cancel();if(routeLayer){map.removeLayer(routeLayer);routeLayer=null}$('route').classList.remove('open');$('navTop').classList.remove('open');$('navBottom').classList.remove('open');$('normal').style.display='';routeData=null;steps=[]}$('stop').onclick=clearRoute;$('routeX').onclick=clearRoute;const sheet=$('sheet');$('report').onclick=()=>sheet.classList.add('open');$('sheetX').onclick=()=>sheet.classList.remove('open');function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}function addEvent(ev,save=true){const icon=L.divIcon({className:'',html:`<div class="event">${ev.icon}</div>`,iconSize:[30,30],iconAnchor:[15,15]});L.marker([ev.lat,ev.lon],{icon}).addTo(map).bindPopup(`<b>${ev.type}</b><br>Zgłoszenie Staniek Maps`);if(save){const all=JSON.parse(localStorage.getItem('staniekReports')||'[]');all.push(ev);localStorage.setItem('staniekReports',JSON.stringify(all))}}document.querySelectorAll('.item').forEach(b=>b.onclick=()=>{if(!pos){toast('Najpierw włącz lokalizację');gps(true);return}const ev={type:b.dataset.type,icon:b.dataset.icon,lat:pos[0],lon:pos[1],time:Date.now()};addEvent(ev,true);sheet.classList.remove('open');toast('✓ Zgłoszono: '+ev.type)});try{JSON.parse(localStorage.getItem('staniekReports')||'[]').filter(e=>Date.now()-e.time<10800000).forEach(e=>addEvent(e,false))}catch(e){}document.addEventListener('click',e=>{if(!e.target.closest('.top')&&!e.target.closest('.results'))$('results').style.display='none'});</script></body></html>
